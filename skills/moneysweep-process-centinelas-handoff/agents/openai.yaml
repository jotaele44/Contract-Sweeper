# OpenAI-runtime agent manifest for moneysweep-process-centinelas-handoff.
# SKILL.md is canonical; keep fields synced with skill-registry.yaml.
schema_version: prii_openai_agent_v1
name: moneysweep-process-centinelas-handoff
description: >-
  MoneySweep end of the Centinelas handoff. Ingests an already-delivered signal
  offline, matches it to located finance, and reports lifecycle stage and handoff
  status. Never collects signals (centinelas-pr owns that) and never promotes past
  pre-official without an officialization record.
instructions_ref: ../SKILL.md
owner_repo: jotaele44/moneysweep-pr
default_mode: offline_write
allowed_modes: [read_only, offline_write]
command_ids: [ingest_centinelas, build_contract_finance_bundle]
stop_conditions:
  - no officialization record (stays pre-official)
  - request would duplicate Centinelas signal ownership
result_envelope:
  - status
  - commands_considered
  - commands_run
  - artifacts
  - blockers
  - contradictions
  - next_safe_action
