schema_version: prii_openai_agent_v1
name: moneysweep-ingest-manual-source
description: >-
  Stages a dropped PDF/XLSX/CSV manual source (Tranche B intake) — file sha256,
  inventory, parser result, schema/row checks, lineage, and review queue. Default
  read-only inspect/dry-run; never auto-promotes a manual source to production.
instructions_ref: ../SKILL.md
owner_repo: jotaele44/moneysweep-pr
