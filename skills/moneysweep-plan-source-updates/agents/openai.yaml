# OpenAI-runtime agent manifest for moneysweep-plan-source-updates.
# SKILL.md is canonical; keep fields synced with skill-registry.yaml.
schema_version: prii_openai_agent_v1
name: moneysweep-plan-source-updates
description: >-
  Plans MoneySweep source refreshes via the update controller — due sources,
  freshness vs SLA, drop scans, and a DAG-safe plan. Default plan-only
  (read_only); a live refresh is live_network and requires explicit user
  authorization.
instructions_ref: ../SKILL.md
owner_repo: jotaele44/moneysweep-pr
default_mode: read_only
allowed_modes: [read_only, offline_write, live_network]
command_ids: []
requires_user_authorization:
  - live_network refresh execution
stop_conditions:
  - invalid policy or DAG
  - missing manual drop for a file-drop source
  - live run not authorized
result_envelope:
  - status
  - commands_considered
  - commands_run
  - artifacts
  - blockers
  - contradictions
  - next_safe_action
