# OpenAI-runtime agent manifest for moneysweep-ownership-capital.
# SKILL.md is canonical; keep fields synced with skill-registry.yaml.
schema_version: prii_openai_agent_v1
name: moneysweep-ownership-capital
description: >-
  Read-only ownership/capital investigator over independently certified MoneySweep
  SEC observations. Preserves whole rows, stable IDs, filing-level amendment
  lineage, exact-period denominators, and provider-metric separation. BPOP is the
  current bounded promoted scope; OFG and EVTC remain regression-only.
instructions_ref: ../SKILL.md
owner_repo: jotaele44/moneysweep-pr
default_mode: read_only
allowed_modes: [read_only, offline_write]
command_ids: []
stop_conditions:
  - certification state is not PASS
  - requested issuer or security is outside the independently certified scope
  - exact historical denominator is unresolved
  - ambiguous identity or amendment lineage
  - provider equivalence would be promoted without semantic proof
  - requested aggregation would synthesize a source record
result_envelope:
  - status
  - certification
  - scope
  - identifiers
  - observations
  - lineage
  - denominators
  - provider_equivalence
  - regression_coverage
  - blockers
  - contradictions
  - next_safe_action
