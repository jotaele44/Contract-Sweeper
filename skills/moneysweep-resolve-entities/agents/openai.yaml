# OpenAI-runtime agent manifest for moneysweep-resolve-entities.
# SKILL.md is canonical; keep fields synced with skill-registry.yaml.
schema_version: prii_openai_agent_v1
name: moneysweep-resolve-entities
description: >-
  Entity resolver for MoneySweep. Proposes vendor/person alias, UEI/DUNS/LEI, and
  parent-child match candidates with evidence and confidence, and queues
  conflicts. Read-only, review-first; never name-merges high-value entities and
  never infers political/risk conclusions from identity proximity.
instructions_ref: ../SKILL.md
owner_repo: jotaele44/moneysweep-pr
default_mode: read_only
allowed_modes: [read_only, offline_write]
command_ids: []
stop_conditions:
  - weak identifier-only match on a high-value entity
  - competing parents
  - unreviewed alias override
result_envelope:
  - status
  - commands_considered
  - commands_run
  - artifacts
  - blockers
  - contradictions
  - next_safe_action
