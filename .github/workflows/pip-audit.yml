name: pip-audit (report-only)

# Report-only: scans the pinned dependency set (requirements.lock) for known
# vulnerabilities on a weekly schedule and on demand. Non-gating to start
# (continue-on-error) so a newly-disclosed CVE surfaces as a visible signal
# without blocking unrelated work; promote to gating once the baseline is clean.
# Operationalizes docs/DEPENDENCY_SECURITY_AUDIT.md.
on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Install pip-audit
        run: |
          # PRII_FETCH_HUB: requirements.lock references ../thehub-pr (editable path)
          if [ ! -d ../thehub-pr ]; then git clone --depth 1 --branch "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" https://github.com/jotaele44/thehub-pr.git ../thehub-pr || git clone --depth 1 https://github.com/jotaele44/thehub-pr.git ../thehub-pr; fi
          pip install pip-audit

      - name: Audit the locked dependency set
        continue-on-error: true
        run: pip-audit --requirement requirements.lock --strict --desc
