name: Reconcile Source Control Plane

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/reconcile-source-control-plane.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: codex/campaign-finance-completion-v0-1
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        shell: bash
        run: |
          grep -vE '^[[:space:]]*-e[[:space:]]' requirements.txt > /tmp/requirements.txt
          python -m pip install -r /tmp/requirements.txt
      - name: Regenerate materialization readiness
        run: python scripts/build_source_recovery_matrix.py
      - name: Reconcile all count surfaces and pinned contracts
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('.')
          readiness_path = root / 'reports/materialization_readiness.json'
          readiness = json.loads(readiness_path.read_text(encoding='utf-8'))
          counts = {
              'total_sources': readiness['total_sources'],
              'automatable_total': readiness['automatable_total'],
              'automatable_ready': readiness['automatable_ready'],
              'queued_excluded_total': readiness['queued_excluded_total'],
              'queued_excluded': readiness['queued_excluded'],
          }

          federation_path = root / 'federation.json'
          federation = json.loads(federation_path.read_text(encoding='utf-8'))
          federation['source_truth'] = counts
          federation_path.write_text(
              json.dumps(federation, indent=2, ensure_ascii=False) + '\n',
              encoding='utf-8',
          )

          reconciliation_path = root / 'reports/federation_source_status_reconciliation.json'
          reconciliation = json.loads(reconciliation_path.read_text(encoding='utf-8'))
          reconciliation['canonical_source_count'] = counts['total_sources']
          for key in ('automatable_total', 'automatable_ready', 'queued_excluded_total', 'queued_excluded'):
              reconciliation[key] = counts[key]
          reconciliation_path.write_text(
              json.dumps(reconciliation, indent=2, ensure_ascii=False) + '\n',
              encoding='utf-8',
          )

          current_path = root / 'reports/current_status.json'
          current = json.loads(current_path.read_text(encoding='utf-8'))
          current['source_registry_current']['total_sources'] = counts['total_sources']
          current['source_registry_current']['source_ids_sha256'] = readiness[
              'source_count_provenance'
          ]['source_ids_sha256']
          current['materialization_readiness_truth'] = counts
          current_path.write_text(
              json.dumps(current, indent=2, ensure_ascii=False) + '\n',
              encoding='utf-8',
          )

          replacements = {
              'tests/test_materialization_runbook_controls.py': [
                  ('snapshot["total_sources"] == 151', 'snapshot["total_sources"] == 154'),
                  ('snapshot["automatable_total"] == 104', 'snapshot["automatable_total"] == 107'),
                  ('snapshot["automatable_ready"] == 104', 'snapshot["automatable_ready"] == 107'),
              ],
              'tests/test_source_update_cli.py': [
                  ('payload["selected"] == 151', 'payload["selected"] == 154'),
                  ('payload["registry_snapshot"]["source_count"] == 151', 'payload["registry_snapshot"]["source_count"] == 154'),
              ],
              'tests/test_source_update_planner.py': [('151', '154')],
              'tests/test_source_update_policy.py': [('151', '154')],
              'tests/test_source_update_state.py': [('151', '154')],
          }
          for rel, pairs in replacements.items():
              path = root / rel
              text = path.read_text(encoding='utf-8')
              for old, new in pairs:
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')
          PY
      - name: Regenerate source registry status after reconciliation
        run: python scripts/gap_analysis_builder.py
      - name: Validate reconciled source-control plane
        run: >-
          python -m pytest -q -o addopts=''
          tests/test_materialization_runbook_controls.py
          tests/test_source_count_reconciliation.py
          tests/test_source_registry_integrity.py
          tests/test_source_registry_top_form.py
          tests/test_source_update_cli.py
          tests/test_source_update_planner.py
          tests/test_source_update_policy.py
          tests/test_source_update_state.py
      - name: Publish and self-remove
        shell: bash
        run: |
          rm .github/workflows/reconcile-source-control-plane.yml
          git add \
            federation.json \
            reports/materialization_readiness.json \
            reports/source_recovery_matrix.csv \
            reports/source_recovery_matrix.md \
            reports/source_registry_status.csv \
            reports/federation_source_status_reconciliation.json \
            reports/current_status.json \
            tests/test_materialization_runbook_controls.py \
            tests/test_source_update_cli.py \
            tests/test_source_update_planner.py \
            tests/test_source_update_policy.py \
            tests/test_source_update_state.py \
            .github/workflows/reconcile-source-control-plane.yml
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "fix: reconcile 154-source control plane"
          git push origin HEAD:codex/campaign-finance-completion-v0-1
