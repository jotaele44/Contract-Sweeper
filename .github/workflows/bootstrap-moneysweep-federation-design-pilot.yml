name: publish-moneysweep-federation-design-pilot-evidence

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/bootstrap-moneysweep-federation-design-pilot.yml

permissions:
  actions: read
  contents: write

concurrency:
  group: publish-moneysweep-federation-design-pilot-evidence-v0-1
  cancel-in-progress: true

jobs:
  publish-evidence:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      ARTIFACT_ID: "8693862881"
      ARTIFACT_ZIP_SHA256: ed6bc7be397f909e5727e1e26a67b20dc74338991c838f1348a5d7bad0d1953f
      EVIDENCE_TAR_SHA256: 0805763b19c0f2b341fdda56ae2b30e46413dca3fc415adefc51b571c9c8d1aa
      BRANCH: agent/moneysweep-federation-design-pilot-v0-1-main
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/moneysweep-federation-design-pilot-v0-1-main
          fetch-depth: 0

      - name: Download and verify certified evidence artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/pilot-artifact /tmp/pilot-extracted
          curl -fsSL -L \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" \
            -o /tmp/pilot-artifact/artifact.zip
          test "$(sha256sum /tmp/pilot-artifact/artifact.zip | awk '{print $1}')" = "$ARTIFACT_ZIP_SHA256"
          unzip -q /tmp/pilot-artifact/artifact.zip -d /tmp/pilot-artifact/unzipped
          tarball=/tmp/pilot-artifact/unzipped/moneysweep-federation-design-pilot-evidence.tar.gz
          test "$(sha256sum "$tarball" | awk '{print $1}')" = "$EVIDENCE_TAR_SHA256"
          tar -xzf "$tarball" -C /tmp/pilot-extracted

      - name: Restore certified non-workflow files
        run: |
          set -euo pipefail
          src=/tmp/pilot-extracted
          files=(
            dashboard/package-lock.json
            dashboard/src/components/RelationshipGraph.jsx
            dashboard/src/main.jsx
            dashboard/src/styles/pilot.css
            dashboard/scripts/run-federation-pilot-visual-checks.mjs
            dashboard/scripts/verify-federation-design-package.mjs
            dashboard/tests/federation-pilot.test.mjs
            dashboard/federation-pilot-atlas.html
            dashboard/src/styles/federation-pilot-atlas.css
            dashboard/src/visual-tests/FederationPilotAtlas.jsx
            docs/MONEYSWEEP_FEDERATION_DESIGN_PILOT_IMPLEMENTATION_LEDGER_v0_1.md
            docs/MONEYSWEEP_FEDERATION_DESIGN_PILOT_ROLLBACK_PLAN_v0_1.md
            docs/MONEYSWEEP_FEDERATION_DESIGN_PILOT_VISUAL_STATE_ATLAS_v0_1.md
          )
          for path in "${files[@]}"; do
            test -f "$src/$path"
            mkdir -p "$(dirname "$path")"
            cp "$src/$path" "$path"
          done
          rm -rf docs/evidence/moneysweep-federation-design-pilot-v0-1
          mkdir -p docs/evidence
          cp -R "$src/docs/evidence/moneysweep-federation-design-pilot-v0-1" docs/evidence/
          git status --short

      - name: Commit certified evidence without workflow mutations
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- \
            dashboard/package-lock.json \
            dashboard/src/components/RelationshipGraph.jsx \
            dashboard/src/main.jsx \
            dashboard/src/styles/pilot.css \
            dashboard/scripts \
            dashboard/tests \
            dashboard/federation-pilot-atlas.html \
            dashboard/src/styles/federation-pilot-atlas.css \
            dashboard/src/visual-tests \
            docs/MONEYSWEEP_FEDERATION_DESIGN_PILOT_IMPLEMENTATION_LEDGER_v0_1.md \
            docs/MONEYSWEEP_FEDERATION_DESIGN_PILOT_ROLLBACK_PLAN_v0_1.md \
            docs/MONEYSWEEP_FEDERATION_DESIGN_PILOT_VISUAL_STATE_ATLAS_v0_1.md \
            docs/evidence/moneysweep-federation-design-pilot-v0-1
          git commit -m "feat(dashboard): publish certified federation design pilot evidence"
          git push origin HEAD:"$BRANCH"
