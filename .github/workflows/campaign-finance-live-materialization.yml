name: Campaign Finance Live Materialization

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/campaign-finance-live-materialization.yml"
      - ".github/workflows/campaign-finance-repair.yml"
      - "scripts/download_fec_committees.py"
      - "scripts/download_oce.py"
      - "scripts/gen_dashboard_snapshot.py"
      - "scripts/materialize_campaign_finance.py"
      - "scripts/validate_campaign_finance_materialization.py"
      - "scripts/build_campaign_finance_entities.py"
      - "reports/completeness_matrix.csv"
      - "reports/completeness_matrix.json"
      - "skills/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: campaign-finance-live-materialization-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      changed: ${{ steps.publish.outputs.changed }}
    steps:
      - name: Check out repair branch with history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: codex/campaign-finance-completion-v0-1
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Install repair and validation tooling
        shell: bash
        run: |
          python -m pip install --upgrade pip
          grep -vE '^[[:space:]]*-e[[:space:]]' requirements.txt > /tmp/moneysweep-requirements.txt
          python -m pip install -r /tmp/moneysweep-requirements.txt
          python -m pip install 'ruff==0.15.18' 'mypy>=1.18,<2' 'fastapi>=0.115,<1'

      - name: Apply idempotent campaign-finance repairs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_if_present(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              if old in text:
                  file.write_text(text.replace(old, new, 1), encoding="utf-8")

          path = "scripts/validate_campaign_finance_materialization.py"
          replace_if_present(path, "from pathlib import Path\n", "from pathlib import Path\nfrom typing import Any\n")
          replace_if_present(path, "FILE_RULES = {", "FILE_RULES: dict[str, dict[str, Any]] = {")
          replace_if_present(path, "DERIVED_CONDITIONAL = {", "DERIVED_CONDITIONAL: dict[str, dict[str, Any]] = {")
          replace_if_present(
              path,
              '    resolution_metrics = {"resolved": 0, "unresolved": 0, "resolution_rate": None}\n',
              '    resolution_metrics: dict[str, int | float | None] = {\n'
              '        "resolved": 0,\n'
              '        "unresolved": 0,\n'
              '        "resolution_rate": None,\n'
              '    }\n',
          )

          replace_if_present(
              "scripts/build_campaign_finance_entities.py",
              "    def _normalize(value: object) -> str:\n        text = re.sub(r\"[^\\w\\s]\", \" \", str(value or \"\").upper())\n",
              "    def _normalize(name: str) -> str:\n        text = re.sub(r\"[^\\w\\s]\", \" \", str(name or \"\").upper())\n",
          )

          replace_if_present(
              "scripts/download_oce.py",
              "        params: dict[str, object] = {\n",
              "        params: dict[str, str | int] = {\n",
          )

          snapshot = "scripts/gen_dashboard_snapshot.py"
          replace_if_present(
              snapshot,
              '    "/campaign-finance/contributions": campaign.campaign_finance_contributions,\n',
              '    "/campaign-finance/contributions": lambda: campaign.campaign_finance_contributions(\n'
              '        limit=500, offset=0\n'
              '    ),\n',
          )
          replace_if_present(
              snapshot,
              '    "/campaign-finance/entities": campaign.campaign_finance_entities,\n',
              '    "/campaign-finance/entities": lambda: campaign.campaign_finance_entities(limit=1000),\n',
          )
          replace_if_present(
              snapshot,
              '    "/campaign-finance/reports": campaign.campaign_finance_reports,\n',
              '    "/campaign-finance/reports": lambda: campaign.campaign_finance_reports(limit=1000),\n',
          )
          PY

      - name: Restore approved 11-skill packet
        shell: bash
        run: |
          source_commit=34ef3b9352493d0b6ba4eb821d7ea544bec0933b
          git checkout "$source_commit" -- \
            skills/moneysweep-operator \
            skills/moneysweep-run-preflight \
            skills/moneysweep-plan-source-updates \
            skills/moneysweep-recover-source-coverage \
            skills/moneysweep-ingest-manual-source \
            skills/moneysweep-audit-financial-gaps \
            skills/moneysweep-resolve-entities \
            skills/moneysweep-process-centinelas-handoff \
            skills/moneysweep-build-federation-export \
            skills/moneysweep-assess-promotion-readiness \
            skills/prii-check-producer-contract

      - name: Apply canonical Ruff formatting
        shell: bash
        run: |
          files=(
            scripts/build_campaign_finance_entities.py
            scripts/campaign_finance_common.py
            scripts/download_fec_committees.py
            scripts/download_oce.py
            scripts/gen_dashboard_snapshot.py
            scripts/ingest_donaciones.py
            scripts/ingest_oce.py
            scripts/materialize_campaign_finance.py
            scripts/validate_campaign_finance_materialization.py
            server/backend/campaign_finance.py
            tests/test_campaign_finance_api.py
            tests/test_campaign_finance_entities.py
            tests/test_campaign_finance_validation.py
            tests/test_ingest_donaciones.py
            tests/test_ingest_oce.py
          )
          ruff format "${files[@]}"
          ruff check "${files[@]}"
          ruff format --check "${files[@]}"

      - name: Regenerate deterministic completeness outputs
        run: python scripts/build_completeness_matrix.py

      - name: Validate type and snapshot fixes
        shell: bash
        run: |
          python -m mypy \
            scripts/validate_campaign_finance_materialization.py \
            scripts/build_campaign_finance_entities.py \
            scripts/download_oce.py
          snapshot=dashboard/src/lib/snapshot.json
          cp "$snapshot" /tmp/snapshot.json
          python scripts/gen_dashboard_snapshot.py
          mv /tmp/snapshot.json "$snapshot"

      - name: Run focused repair tests
        run: >-
          python -m pytest -q -o addopts=''
          tests/test_campaign_finance_api.py
          tests/test_campaign_finance_entities.py
          tests/test_campaign_finance_validation.py
          tests/test_download_oce.py
          tests/test_ingest_donaciones.py
          tests/test_ingest_oce.py
          tests/skill_contract/test_skill_packet.py
          tests/test_completeness_matrix.py

      - name: Publish repair commit when needed
        id: publish
        shell: bash
        run: |
          rm -f .github/workflows/campaign-finance-repair.yml
          git add -A
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "fix: close campaign finance CI and baseline gaps"
          git push origin HEAD:codex/campaign-finance-completion-v0-1
          echo "changed=true" >> "$GITHUB_OUTPUT"

  materialize:
    needs: repair
    if: ${{ needs.repair.outputs.changed != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      FEC_API_KEY: ${{ secrets.FEC_API_KEY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Verify FEC credential is configured
        shell: bash
        run: |
          if [[ -z "${FEC_API_KEY:-}" ]]; then
            echo "::error::Repository Actions secret FEC_API_KEY is not configured."
            exit 1
          fi
          echo "::add-mask::$FEC_API_KEY"

      - name: Install campaign-finance dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          grep -vE '^[[:space:]]*-e[[:space:]]' requirements.txt > /tmp/campaign-finance-requirements.txt
          python -m pip install -r /tmp/campaign-finance-requirements.txt

      - name: Fetch live FEC committee master and outflows
        shell: bash
        run: |
          set -o pipefail
          mkdir -p reports/campaign_finance
          python scripts/download_fec_committees.py --force \
            2>&1 | tee reports/campaign_finance/fec_outflows.txt

      - name: Run strict campaign-finance materialization
        shell: bash
        run: |
          set -o pipefail
          python scripts/materialize_campaign_finance.py \
            --live-oce \
            --strict \
            2>&1 | tee reports/campaign_finance/live_materialization.txt

      - name: Upload campaign-finance evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: campaign-finance-live-materialization
          if-no-files-found: warn
          retention-days: 14
          path: |
            reports/campaign_finance/
            data/manifests/campaign_finance/
            data/staging/processed/pr_fec_contributions.csv
            data/staging/processed/pr_fec_committees.csv
            data/staging/processed/pr_fec_disbursements.csv
            data/staging/processed/pr_fec_independent_expenditures.csv
            data/staging/processed/pr_oce_donations.csv
            data/staging/processed/pr_oce_reports.csv
            data/staging/processed/pr_campaign_finance_candidates.csv
            data/staging/processed/pr_campaign_finance_committees.csv
            data/staging/processed/pr_campaign_finance_recipient_resolution.csv
            data/staging/processed/pr_campaign_finance_edges.csv
