name: Campaign Finance Live Materialization

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/campaign-finance-live-materialization.yml"
      - "scripts/download_fec_committees.py"
      - "scripts/download_fec_schedule_e_resumable.py"
      - "scripts/download_oce.py"
      - "scripts/gen_dashboard_snapshot.py"
      - "scripts/materialize_campaign_finance.py"
      - "scripts/validate_campaign_finance_materialization.py"
      - "scripts/build_campaign_finance_entities.py"
      - "reports/completeness_matrix.csv"
      - "reports/completeness_matrix.json"
      - "skills/**"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: campaign-finance-live-materialization-${{ github.ref }}
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      FEC_API_KEY: ${{ secrets.FEC_API_KEY }}
      SCHEDULE_B_ARTIFACT_ID: "8830412540"
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Verify FEC credential is configured
        shell: bash
        run: |
          if [[ -z "${FEC_API_KEY:-}" ]]; then
            echo "::error::Repository Actions secret FEC_API_KEY is not configured."
            exit 1
          fi
          echo "::add-mask::$FEC_API_KEY"

      - name: Install campaign-finance dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          grep -vE '^[[:space:]]*-e[[:space:]]' requirements.txt > /tmp/campaign-finance-requirements.txt
          python -m pip install -r /tmp/campaign-finance-requirements.txt

      - name: Restore certified Schedule B checkpoint
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/schedule-b-checkpoint
          curl --fail --location --retry 5 --retry-all-errors \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${SCHEDULE_B_ARTIFACT_ID}/zip" \
            --output /tmp/schedule-b-checkpoint.zip
          unzip -q /tmp/schedule-b-checkpoint.zip -d /tmp/schedule-b-checkpoint
          cp -R /tmp/schedule-b-checkpoint/data .
          cp -R /tmp/schedule-b-checkpoint/reports .
          test -s data/staging/processed/pr_fec_committees.csv
          test -s data/staging/processed/pr_fec_disbursements.csv
          python - <<'PY'
          import pandas as pd
          path = "data/staging/processed/pr_fec_disbursements.csv"
          rows = len(pd.read_csv(path, low_memory=False))
          if rows != 3495:
              raise SystemExit(f"Schedule B checkpoint row mismatch: {rows} != 3495")
          print(f"Restored Schedule B rows: {rows}")
          PY

      - name: Restore latest Schedule E page checkpoint
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          artifacts_url="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=campaign-finance-live-materialization&per_page=100"
          artifact_id="$(
            curl --fail --silent --show-error \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "Accept: application/vnd.github+json" \
              "$artifacts_url" \
            | jq -r '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | reverse | .[0].id // empty'
          )"
          if [[ -z "$artifact_id" ]]; then
            echo "No prior Schedule E checkpoint artifact found; starting from page 1."
            exit 0
          fi
          mkdir -p /tmp/schedule-e-checkpoint
          curl --fail --location --retry 5 --retry-all-errors \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" \
            --output /tmp/schedule-e-checkpoint.zip
          unzip -q /tmp/schedule-e-checkpoint.zip -d /tmp/schedule-e-checkpoint
          if [[ -d /tmp/schedule-e-checkpoint/data/checkpoints/campaign_finance/fec_schedule_e ]]; then
            mkdir -p data/checkpoints/campaign_finance
            cp -R /tmp/schedule-e-checkpoint/data/checkpoints/campaign_finance/fec_schedule_e \
              data/checkpoints/campaign_finance/
          fi
          if [[ -f /tmp/schedule-e-checkpoint/data/manifests/campaign_finance/fec_schedule_e_acquisition.json ]]; then
            mkdir -p data/manifests/campaign_finance
            cp /tmp/schedule-e-checkpoint/data/manifests/campaign_finance/fec_schedule_e_acquisition.json \
              data/manifests/campaign_finance/
          fi

      - name: Fetch live FEC Schedule E with page checkpoints
        shell: bash
        run: |
          set -o pipefail
          mkdir -p reports/campaign_finance
          python scripts/download_fec_schedule_e_resumable.py --resume \
            2>&1 | tee reports/campaign_finance/fec_schedule_e.txt

      - name: Run strict campaign-finance materialization
        shell: bash
        run: |
          set -o pipefail
          python scripts/materialize_campaign_finance.py \
            --live-oce \
            --strict \
            2>&1 | tee reports/campaign_finance/live_materialization.txt

      - name: Upload campaign-finance evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: campaign-finance-live-materialization
          if-no-files-found: warn
          retention-days: 14
          path: |
            reports/campaign_finance/
            data/checkpoints/campaign_finance/fec_schedule_e/
            data/manifests/campaign_finance/
            data/staging/processed/pr_fec_contributions.csv
            data/staging/processed/pr_fec_committees.csv
            data/staging/processed/pr_fec_disbursements.csv
            data/staging/processed/pr_fec_independent_expenditures.csv
            data/staging/processed/pr_oce_donations.csv
            data/staging/processed/pr_oce_reports.csv
            data/staging/processed/pr_campaign_finance_candidates.csv
            data/staging/processed/pr_campaign_finance_committees.csv
            data/staging/processed/pr_campaign_finance_recipient_resolution.csv
            data/staging/processed/pr_campaign_finance_edges.csv
