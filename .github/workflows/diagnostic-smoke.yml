name: Diagnostic smoke

on: [push, pull_request]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnostic-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
          cache: pip
      - name: Assert isolated checkout
        run: test ! -e "$GITHUB_WORKSPACE/../thehub-pr"
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          test ! -e "$GITHUB_WORKSPACE/../thehub-pr"
      - name: Dry-run run_all
        run: |
          python3 run_all.py --only-setup --strict-preflight
          echo "diagnostic smoke: run_all --only-setup --strict-preflight exited $?"
