name: Workflow static validation

on:
  push:
    paths:
      - ".github/workflows/**"
      - "scripts/validate_github_workflows.py"
      - "scripts/validate_live_fetch_dispatch.py"
      - "tests/test_live_fetch_dispatch.py"
      - "tests/test_workflow_static_validation.py"
  pull_request:
    paths:
      - ".github/workflows/**"
      - "scripts/validate_github_workflows.py"
      - "scripts/validate_live_fetch_dispatch.py"
      - "tests/test_live_fetch_dispatch.py"
      - "tests/test_workflow_static_validation.py"
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install pinned validation dependencies
        run: python -m pip install PyYAML==6.0.3 pytest==9.0.2 pytest-cov==7.0.0
      - name: Validate workflow structure and safety invariants
        run: python scripts/validate_github_workflows.py
      - name: Exercise all three network-free preflight decisions
        run: |
          python scripts/validate_live_fetch_dispatch.py \
            --workflow materialize-sources --mode preflight --confirm no \
            --source fec --family federal
          python scripts/validate_live_fetch_dispatch.py \
            --workflow highergov-fetch --mode preflight --confirm no \
            --confirm-secondary no
          python scripts/validate_live_fetch_dispatch.py \
            --workflow sam-opportunities-fetch --mode preflight --confirm no \
            --confirm-secondary no --days 365
      - name: Run focused regression tests
        run: python -m pytest -q -o addopts='' tests/test_live_fetch_dispatch.py tests/test_workflow_static_validation.py
