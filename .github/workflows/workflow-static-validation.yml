name: Workflow static validation

on:
  push:
    paths:
      - ".github/workflows/**"
      - "scripts/validate_github_workflows.py"
      - "scripts/validate_live_fetch_dispatch.py"
      - "tests/test_live_fetch_dispatch.py"
      - "tests/test_workflow_static_validation.py"
  pull_request:
    paths:
      - ".github/workflows/**"
      - "scripts/validate_github_workflows.py"
      - "scripts/validate_live_fetch_dispatch.py"
      - "tests/test_live_fetch_dispatch.py"
      - "tests/test_workflow_static_validation.py"
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Install pinned YAML parser
        run: python -m pip install PyYAML==6.0.3
      - name: Validate workflow structure and safety invariants
        run: python scripts/validate_github_workflows.py
      - name: Exercise all three network-free preflight decisions
        run: |
          python scripts/validate_live_fetch_dispatch.py \
            --workflow materialize-sources --mode preflight --confirm no \
            --source fec --family federal
          python scripts/validate_live_fetch_dispatch.py \
            --workflow highergov-fetch --mode preflight --confirm no \
            --confirm-secondary no
          python scripts/validate_live_fetch_dispatch.py \
            --workflow sam-opportunities-fetch --mode preflight --confirm no \
            --confirm-secondary no --days 365
      - name: Run focused regression tests
        run: python -m pytest -q tests/test_live_fetch_dispatch.py tests/test_workflow_static_validation.py
