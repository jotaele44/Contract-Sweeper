name: Generate Readiness Repair Artifact

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/generate-readiness-artifact.yml

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        shell: bash
        run: |
          grep -vE '^[[:space:]]*-e[[:space:]]' requirements.txt > /tmp/requirements.txt
          python -m pip install -r /tmp/requirements.txt
      - name: Regenerate readiness outputs
        run: python scripts/build_source_recovery_matrix.py
      - name: Upload deterministic outputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: readiness-repair
          path: |
            reports/source_recovery_matrix.csv
            reports/source_recovery_matrix.md
            reports/materialization_readiness.json
          if-no-files-found: error
          retention-days: 1
