name: Publish Readiness Repair

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/generate-readiness-artifact.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: codex/campaign-finance-completion-v0-1
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        shell: bash
        run: |
          grep -vE '^[[:space:]]*-e[[:space:]]' requirements.txt > /tmp/requirements.txt
          python -m pip install -r /tmp/requirements.txt
      - name: Regenerate deterministic readiness outputs
        shell: bash
        run: |
          python scripts/build_source_recovery_matrix.py
          python - <<'PY'
          import json
          from pathlib import Path

          readiness_path = Path("reports/materialization_readiness.json")
          status_path = Path("reports/current_status.json")
          readiness = json.loads(readiness_path.read_text(encoding="utf-8"))
          status = json.loads(status_path.read_text(encoding="utf-8"))
          current = status["source_registry_current"]
          current["total_sources"] = readiness["total_sources"]
          current["source_ids_sha256"] = readiness["source_count_provenance"][
              "source_ids_sha256"
          ]
          status_path.write_text(
              json.dumps(status, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )
          PY
      - name: Validate readiness and legacy donations contracts
        run: python -m pytest -q -o addopts='' tests/test_donaciones_ingest.py tests/test_materialization_readiness.py
      - name: Publish and self-remove
        shell: bash
        run: |
          rm .github/workflows/generate-readiness-artifact.yml
          git add reports/source_recovery_matrix.csv \
            reports/source_recovery_matrix.md \
            reports/materialization_readiness.json \
            reports/current_status.json \
            .github/workflows/generate-readiness-artifact.yml
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "fix: refresh materialization readiness outputs"
          git push origin HEAD:codex/campaign-finance-completion-v0-1
