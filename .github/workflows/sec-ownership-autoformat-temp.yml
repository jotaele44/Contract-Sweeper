name: SEC Ownership Autoformat Temp

on:
  pull_request:
    paths:
      - "moneysweep/capital_control/sec13f.py"
      - "scripts/acquire_sec13f_bpop_golden.py"
      - "scripts/certify_bpop_sec13f_8q.py"
      - "scripts/download_sec_equity_v2.py"
      - "scripts/rematerialize_sec_holdings_discovery_v2.py"
      - "tests/test_sec_ownership_hardening_v0_3.py"
      - ".github/workflows/sec-ownership-autoformat-temp.yml"

permissions:
  contents: write

jobs:
  format:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'codex/ownership-and-capital-sec13f-v0-3-clean' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
        with:
          python-version: "3.11"
      - name: Format changed Python surfaces
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install ruff==0.16.4
          files=(
            moneysweep/capital_control/sec13f.py
            scripts/acquire_sec13f_bpop_golden.py
            scripts/certify_bpop_sec13f_8q.py
            scripts/download_sec_equity_v2.py
            scripts/rematerialize_sec_holdings_discovery_v2.py
            tests/test_sec_ownership_hardening_v0_3.py
          )
          python -m ruff check --fix "${files[@]}"
          python -m ruff format "${files[@]}"
          if git diff --quiet -- "${files[@]}"; then
            echo "No formatting changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "${files[@]}"
          git commit -m "style: format SEC ownership hardening"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
