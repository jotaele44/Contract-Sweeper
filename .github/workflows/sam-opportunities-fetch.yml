name: SAM Opportunities fetch

# Manual-only refresh of the pre-award federal solicitations feed. Output is
# uploaded as an artifact and never committed (data/** is gitignored).
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type 'YES' (case-insensitive) to confirm fetch"
        required: true
        default: "no"
      confirm_secondary:
        description: "Type 'FETCH' (case-insensitive) to allow actual downloads"
        required: true
        default: "no"
      dry_run:
        description: "Validate the confirmation and secret gates without downloading"
        required: true
        type: boolean
        default: true
      days:
        description: "Lookback window in days (1-3650; default 365)"
        required: false
        default: "365"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fetch_sam_opportunities:
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate fail-closed dispatch gate
        id: gate
        shell: bash
        env:
          CONFIRM: ${{ inputs.confirm }}
          CONFIRM_SECONDARY: ${{ inputs.confirm_secondary }}
          DRY_RUN: ${{ inputs.dry_run }}
          DAYS: ${{ inputs.days }}
          SAM_API_KEY: ${{ secrets.SAM_API_KEY }}
        run: |
          set -euo pipefail
          authorized=false
          secret_present=false
          mode=confirmation-missing
          if ! python3 - "$DAYS" <<'PY'
          import sys

          raw = sys.argv[1]
          if not raw.isascii() or not raw.isdigit() or len(raw) > 4:
              raise SystemExit(1)
          value = int(raw, 10)
          if not 1 <= value <= 3650:
              raise SystemExit(1)
          PY
          then
            mode=invalid-days
          elif [[ -n "$SAM_API_KEY" ]]; then
            secret_present=true
          fi
          if [[ "$mode" != "invalid-days" && "${CONFIRM^^}" == "YES" && "${CONFIRM_SECONDARY^^}" == "FETCH" ]]; then
            if [[ "$DRY_RUN" == "true" ]]; then
              mode=dry-run
            elif [[ "$secret_present" != "true" ]]; then
              mode=missing-secret
            else
              authorized=true
              mode=live
            fi
          fi
          echo "authorized=$authorized" >> "$GITHUB_OUTPUT"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: ${{ steps.gate.outputs.authorized == 'true' }}

      - name: Set up Python
        if: ${{ steps.gate.outputs.authorized == 'true' }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        if: ${{ steps.gate.outputs.authorized == 'true' }}
        run: |
          if [ ! -d ../thehub-pr ]; then
            git clone --depth 1 --branch "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" https://github.com/jotaele44/thehub-pr.git ../thehub-pr || \
              git clone --depth 1 https://github.com/jotaele44/thehub-pr.git ../thehub-pr
          fi
          pip install -r requirements.txt

      - name: Fetch SAM.gov opportunities
        if: ${{ steps.gate.outputs.authorized == 'true' }}
        env:
          SAM_API_KEY: ${{ secrets.SAM_API_KEY }}
          DAYS: ${{ inputs.days }}
        run: python3 scripts/download_sam_opportunities.py --force --days "$DAYS"

      - name: Upload SAM opportunities artifact
        if: ${{ always() && steps.gate.outputs.authorized == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sam-opportunities-${{ github.run_id }}
          path: data/staging/processed/pr_sam_opportunities.csv
          if-no-files-found: ignore

      - name: Write redacted dispatch receipt
        if: ${{ always() }}
        env:
          AUTHORIZED: ${{ steps.gate.outputs.authorized }}
          MODE: ${{ steps.gate.outputs.mode }}
          DAYS: ${{ inputs.days }}
        run: |
          mkdir -p dispatch-receipt
          python3 - <<'PY'
          import json, os
          from pathlib import Path

          raw_days = os.environ.get("DAYS", "")
          days = None
          if raw_days.isascii() and raw_days.isdigit() and len(raw_days) <= 4:
              value = int(raw_days, 10)
              if 1 <= value <= 3650:
                  days = value

          Path("dispatch-receipt/sam-opportunities-fetch.json").write_text(
              json.dumps({
                  "schemaVersion": "1.0.0",
                  "workflow": "sam-opportunities-fetch",
                  "authorized": os.environ.get("AUTHORIZED") == "true",
                  "mode": os.environ.get("MODE", "gate-unavailable"),
                  "days": days,
                  "liveFetchAuthorized": os.environ.get("AUTHORIZED") == "true",
              }, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload dispatch receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sam-opportunities-fetch-dispatch-receipt-${{ github.run_id }}
          path: dispatch-receipt/sam-opportunities-fetch.json
          if-no-files-found: error
