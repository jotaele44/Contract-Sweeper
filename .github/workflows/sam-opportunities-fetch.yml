name: SAM Opportunities fetch

# Manual-only refresh of the pre-award federal solicitations feed. Preflight is
# the default and performs no network access. Live output is an artifact only.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "preflight validates controls; fetch executes the live download"
        required: true
        type: choice
        options:
          - preflight
          - fetch
        default: preflight
      confirm:
        description: "For fetch mode only, type exactly YES"
        required: false
        default: "no"
      confirm_secondary:
        description: "For fetch mode only, type exactly FETCH"
        required: false
        default: "no"
      days:
        description: "Lookback window, bounded to 1-1095 days"
        required: false
        default: "365"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate_dispatch:
    name: Validate bounded dispatch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Validate confirmation tokens and lookback
        env:
          DISPATCH_MODE: ${{ github.event.inputs.mode }}
          DISPATCH_CONFIRM: ${{ github.event.inputs.confirm }}
          DISPATCH_CONFIRM_SECONDARY: ${{ github.event.inputs.confirm_secondary }}
          DISPATCH_DAYS: ${{ github.event.inputs.days }}
        run: |
          python3 scripts/validate_live_fetch_dispatch.py \
            --workflow sam-opportunities-fetch \
            --mode "$DISPATCH_MODE" \
            --confirm "$DISPATCH_CONFIRM" \
            --confirm-secondary "$DISPATCH_CONFIRM_SECONDARY" \
            --days "$DISPATCH_DAYS"

      - name: Compile fetch entry point without importing dependencies
        run: python3 -m py_compile scripts/download_sam_opportunities.py

  fetch_sam_opportunities:
    name: Fetch SAM.gov opportunities
    needs: validate_dispatch
    if: github.event.inputs.mode == 'fetch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          if [ ! -d ../thehub-pr ]; then
            git clone --depth 1 --branch "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" \
              https://github.com/jotaele44/thehub-pr.git ../thehub-pr \
              || git clone --depth 1 https://github.com/jotaele44/thehub-pr.git ../thehub-pr
          fi
          pip install -r requirements.txt

      - name: Require SAM credential
        env:
          SAM_API_KEY: ${{ secrets.SAM_API_KEY }}
        run: |
          if [ -z "$SAM_API_KEY" ]; then
            echo "::error::SAM_API_KEY is not configured"
            exit 1
          fi

      - name: Fetch SAM.gov opportunities
        env:
          SAM_API_KEY: ${{ secrets.SAM_API_KEY }}
          DISPATCH_DAYS: ${{ github.event.inputs.days }}
        run: |
          python3 scripts/download_sam_opportunities.py \
            --force \
            --days "$DISPATCH_DAYS" \
            --state PR

      - name: Upload SAM opportunities artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sam-opportunities
          path: data/staging/processed/pr_sam_opportunities.csv
          if-no-files-found: ignore
