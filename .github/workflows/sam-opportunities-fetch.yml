name: SAM Opportunities fetch

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type 'YES' (case-insensitive) to confirm fetch"
        required: true
        default: "no"
      confirm_secondary:
        description: "Type 'FETCH' (case-insensitive) to allow actual downloads"
        required: true
        default: "no"
      days:
        description: "Lookback window in days (default 365; >365 is split into API-legal windows)"
        required: false
        default: "365"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fetch_sam_opportunities:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
          cache: pip
      - name: Assert isolated checkout
        run: test ! -e "$GITHUB_WORKSPACE/../thehub-pr"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          test ! -e "$GITHUB_WORKSPACE/../thehub-pr"
      - name: Fetch SAM.gov opportunities
        id: fetch
        if: ${{ startsWith(github.event.inputs.confirm, 'yes') && startsWith(github.event.inputs.confirm_secondary, 'fetch') }}
        env:
          SAM_API_KEY: ${{ secrets.SAM_API_KEY }}
        run: |
          if [ -z "$SAM_API_KEY" ]; then
            echo "SAM_API_KEY not set — skipping fetch."
            exit 0
          fi
          echo "fetched=true" >> "$GITHUB_OUTPUT"
          echo "Starting SAM.gov opportunities fetch..."
          python3 scripts/download_sam_opportunities.py --force --days "${{ github.event.inputs.days }}"
      - name: Upload SAM opportunities artifact
        if: ${{ steps.fetch.outputs.fetched == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sam-opportunities
          path: data/staging/processed/pr_sam_opportunities.csv
          if-no-files-found: ignore
