name: Lockfile drift

# Gating: requirements.lock is compiled from requirements.in by uv. This re-runs
# the compile and fails if the committed lock is stale, so a dependency change to
# requirements.in can't merge without its lockfile update (and vice versa).
on: [push, pull_request]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lock-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7

      - name: Recompile the lockfile
        run: |
          # PRII_FETCH_HUB: ensure shared federation libs resolve
          if [ ! -d ../thehub-pr ]; then git clone --depth 1 --branch "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" https://github.com/jotaele44/thehub-pr.git ../thehub-pr || git clone --depth 1 https://github.com/jotaele44/thehub-pr.git ../thehub-pr; fi
          uv pip compile requirements.in --universal --python-version 3.11 -o requirements.lock

      - name: Upload regenerated lock candidate
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: requirements-lock-python311
          path: requirements.lock
          if-no-files-found: error

      - name: Assert no drift
        run: |
          if ! git diff --exit-code requirements.lock; then
            echo "::error::requirements.lock is out of date with requirements.in." \
              "Run: uv pip compile requirements.in --universal --python-version 3.11 -o requirements.lock"
            exit 1
          fi
