name: Lockfile drift

on: [push, pull_request]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lock-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Assert isolated checkout
        run: test ! -e "$GITHUB_WORKSPACE/../thehub-pr"
      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
      - name: Recompile the lockfile
        run: |
          uv pip compile requirements.in --universal --python-version 3.11 -o requirements.lock
          test ! -e "$GITHUB_WORKSPACE/../thehub-pr"
      - name: Upload regenerated lock candidate
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: requirements-lock-python311
          path: requirements.lock
          if-no-files-found: error
      - name: Assert no drift
        run: |
          if ! git diff --exit-code requirements.lock; then
            echo "::error::requirements.lock is out of date with requirements.in. Run: uv pip compile requirements.in --universal --python-version 3.11 -o requirements.lock"
            exit 1
          fi
