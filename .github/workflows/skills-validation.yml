name: Skills Validation

# Offline validator for the PRII skill packet (blueprint §9). No network, no live
# source acquisition — it only inspects skills/, skill-registry.yaml,
# activation-matrix.yaml, dependency-graph.yaml, federation.json, schemas, and
# the referenced scripts/reports. Gates merges on packet drift.
on:
  push:
    branches: [main]
    paths:
      - "skills/**"
      - "skill-registry.yaml"
      - "activation-matrix.yaml"
      - "dependency-graph.yaml"
      - "federation.json"
      - "schemas/**"
      - "scripts/validate_skills.py"
      - "tests/skill_contract/**"
      - ".github/workflows/skills-validation.yml"
  pull_request:
    paths:
      - "skills/**"
      - "skill-registry.yaml"
      - "activation-matrix.yaml"
      - "dependency-graph.yaml"
      - "federation.json"
      - "schemas/**"
      - "scripts/validate_skills.py"
      - "tests/skill_contract/**"
      - ".github/workflows/skills-validation.yml"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

# Least privilege: this workflow only reads the repo (and uploads artifacts,
# which uses the runtime token, not GITHUB_TOKEN). Widen deliberately if a
# step ever needs to write back.
permissions:
  contents: read

# Supersede older runs of this workflow on the same ref: a newer push
# makes the in-flight result irrelevant, so cancel it and free the runner.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-skill-packet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          # PRII_FETCH_HUB: ensure shared federation libs resolve
          if [ ! -d ../thehub-pr ]; then git clone --depth 1 --branch "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" https://github.com/jotaele44/thehub-pr.git ../thehub-pr || git clone --depth 1 https://github.com/jotaele44/thehub-pr.git ../thehub-pr; fi
          pip install -r requirements.txt

      # One offline validator implements all ten packet checks (structure,
      # registry, command-resolution, path-resolution, boundary-policy,
      # mode-safety, coverage-accounting, export-contract, activation, drift).
      - name: Validate skill packet
        run: python3 scripts/validate_skills.py

      - name: Skill-contract test fixtures
        run: python3 -m pytest tests/skill_contract/ -q -p no:cacheprovider --no-cov
