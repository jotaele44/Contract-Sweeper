name: Temporary guide audit formatter

on:
  push:
    branches:
      - audit/guide-financial-avenue-coverage-v1

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: audit/guide-financial-avenue-coverage-v1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Format changed Python files
        run: |
          python -m pip install ruff==0.16.4
          ruff format \
            scripts/audit_guide_financial_avenues.py \
            scripts/scrape_ocif_guide_financial_classes.py \
            scripts/scrape_ocs_insurers.py \
            scripts/scrape_ftz_board_pr.py \
            tests/test_guide_financial_avenue_audit.py \
            tests/test_guide_financial_source_parsers.py
      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            echo "Already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scripts/audit_guide_financial_avenues.py \
            scripts/scrape_ocif_guide_financial_classes.py \
            scripts/scrape_ocs_insurers.py \
            scripts/scrape_ftz_board_pr.py \
            tests/test_guide_financial_avenue_audit.py \
            tests/test_guide_financial_source_parsers.py
          git commit -m "style: format guide financial audit files"
          git push origin HEAD:audit/guide-financial-avenue-coverage-v1
