name: CEE OCPR amendment probe v0.4

on:
  push:
    branches: [cee-ocpr-row-denominator-v0-4]
    paths: [.github/workflows/cee-ocpr-amendment-probe-v0-4.yml]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe one authoritative detail page
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests beautifulsoup4
          python - <<'PY'
          import json,re
          import requests
          from bs4 import BeautifulSoup
          u='https://consultacontratos.ocpr.gov.pr/contract/details?contractid=5275332'
          r=requests.get(u,headers={'User-Agent':'Mozilla/5.0 MoneySweep-CEE-v0.4'},timeout=60)
          r.raise_for_status()
          open('detail_5275332.html','wb').write(r.content)
          s=BeautifulSoup(r.text,'html.parser')
          print('STATUS',r.status_code,'BYTES',len(r.content),'TITLE',s.title.get_text(' ',strip=True) if s.title else None)
          for tag in s.find_all(['h1','h2','h3','h4','h5','h6','label','button','a']):
              t=' '.join(tag.get_text(' ',strip=True).split())
              blob=' '.join([t,str(tag.get('id') or ''),str(tag.get('name') or ''),str(tag.get('href') or '')])
              if re.search(r'enmiend|amend',blob,re.I): print('NODE',tag.name,repr(t),tag.attrs)
          for i,table in enumerate(s.find_all('table')):
              prev=table.find_previous(['h1','h2','h3','h4','h5','h6'])
              heading=prev.get_text(' ',strip=True) if prev else ''
              headers=[x.get_text(' ',strip=True) for x in table.find_all('th')]
              rows=[]
              for tr in table.find_all('tr'):
                  cells=[x.get_text(' ',strip=True) for x in tr.find_all(['td','th'])]
                  if cells: rows.append(cells)
              print('TABLE',i,'HEADING',repr(heading),'HEADERS',headers,'ROWCOUNT',len(rows),'FIRSTROWS',json.dumps(rows[:5],ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: cee-ocpr-amendment-probe-v0-4
          path: detail_5275332.html
          retention-days: 7
