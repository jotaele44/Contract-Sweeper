name: CEE OCPR amendment probe v0.4

on:
  push:
    branches: [cee-ocpr-row-denominator-v0-4]
    paths: [.github/workflows/cee-ocpr-amendment-probe-v0-4.yml]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe authoritative amendment navigation
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests beautifulsoup4
          python - <<'PY'
          import re, requests
          from bs4 import BeautifulSoup
          base='https://consultacontratos.ocpr.gov.pr'
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0 MoneySweep-CEE-v0.4'})
          search=s.get(base+'/contract',timeout=60); search.raise_for_status()
          open('search.html','wb').write(search.content)
          soup=BeautifulSoup(search.text,'html.parser')
          srcs=[x.get('src') for x in soup.find_all('script') if x.get('src')]
          targets=[x for x in srcs if '/scripts/contract/search' in x or '/scripts/contract/plugins/search' in x]
          print('TARGET_BUNDLES',targets)
          for i,src in enumerate(targets):
              u=src if src.startswith('http') else base+src
              r=s.get(u,timeout=60); r.raise_for_status(); fn=f'bundle_{i}.js'; open(fn,'wb').write(r.content)
              text=r.text
              print('BUNDLE',i,'STATUS',r.status_code,'BYTES',len(r.content),'URL',u)
              for m in re.finditer(r'(?i).{0,220}(?:amend|enmiend|HasAmendments).{0,350}',text):
                  print('MATCH',i,repr(m.group(0)[:900]))
          u=base+'/contract/details?contractid=5275332'
          r=s.get(u,timeout=60); r.raise_for_status(); open('detail_5275332.html','wb').write(r.content)
          d=BeautifulSoup(r.text,'html.parser')
          node=d.find(id='Amendment'); print('DETAIL_AMENDMENT_VALUE', node.get('value') if node else None)
          for tag in d.find_all(['a','form']):
              blob=' '.join(str(tag.get(k) or '') for k in ('href','action','id','class'))
              if re.search(r'(?i)amend|enmiend|contract',blob): print('DETAIL_NAV',tag.name,blob)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: cee-ocpr-amendment-probe-v0-4
          path: |
            search.html
            detail_5275332.html
            bundle_*.js
          retention-days: 7
