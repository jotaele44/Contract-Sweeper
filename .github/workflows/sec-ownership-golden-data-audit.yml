name: SEC Ownership Golden Data Audit

on:
  pull_request:
    paths:
      - "moneysweep/capital_control/**"
      - "moneysweep/sec_equity_identity.py"
      - "scripts/acquire_sec13f_bpop_golden.py"
      - "scripts/certify_bpop_sec13f_8q.py"
      - "scripts/download_sec_equity_v2.py"
      - "registries/capital_control_golden_cases.json"
      - ".github/workflows/sec-ownership-golden-data-audit.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  audit:
    name: BPOP 8Q authoritative-data audit
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
        with:
          python-version: "3.11"
      - name: Install acquisition dependency
        run: python -m pip install "requests>=2.34.2"

      # PR #519 already passed authoritative SEC identity/Company Facts acquisition
      # and froze all eight 13F archives in run 32946731464. Reuse that immutable
      # downstream input instead of refreshing mutable SEC sources after a certifier
      # import-path failure. Other PRs create a new versioned snapshot normally.
      - name: Restore passed SEC snapshot for PR 519
        id: restore
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 519 }}
        env:
          GH_TOKEN: ${{ github.token }}
          SNAPSHOT_ARTIFACT_ID: "9598537414"
          FREEZE_MANIFEST_SHA256: "3234edd4cfe97535b462b34d89bc1e8175d0d983f4a2976de9a84acfc67d9e27"
          EQUITY_RECEIPT_SHA256: "c4603b9989cb1f5c111a997faa8cd833113a089231c2176c8640c25e9bbc89de"
          COMPANIES_SHA256: "bb749a83b3502e5b1936136af3a4bbec430c10fcf3ff9dd6f3b22e6de5dc752a"
          FINANCIALS_SHA256: "3035b5230c74cd940a08e14ba6dcaf1e7ec3e509e3615c1718bc7b2c45218894"
          DENOMINATORS_SHA256: "ac773f11b5fb736c96bf64231207ddb3254cb0d2e07755eecf4a2131001498ec"
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/sec-ownership-bpop-8q-audit.zip"
          curl --fail --location --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -o "$archive" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$SNAPSHOT_ARTIFACT_ID/zip"
          unzip -q "$archive" -d "$GITHUB_WORKSPACE"
          printf '%s  %s\n' \
            "$FREEZE_MANIFEST_SHA256" data/manifests/capital_control/bpop_8q_freeze_manifest.json \
            "$EQUITY_RECEIPT_SHA256" data/manifests/sec_equity_v2/receipt.json \
            "$COMPANIES_SHA256" data/staging/processed/pr_sec_companies_v2.csv \
            "$FINANCIALS_SHA256" data/staging/processed/pr_sec_financials_v2.csv \
            "$DENOMINATORS_SHA256" data/staging/processed/pr_sec_share_denominators_v2.csv \
            | sha256sum --check --strict
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path.cwd()
          freeze = root / "data/manifests/capital_control/bpop_8q_freeze_manifest.json"
          if not freeze.is_file():
              raise SystemExit("restored snapshot lacks bpop_8q_freeze_manifest.json")
          payload = json.loads(freeze.read_text(encoding="utf-8"))
          archives = payload.get("archives", [])
          if payload.get("archive_count") != 8 or len(archives) != 8:
              raise SystemExit("restored snapshot does not contain exact eight-archive denominator")
          for item in archives:
              filename = item.get("filename")
              path = root / "data/staging/raw/sec13f_bulk/bpop_8q_v1" / str(filename)
              if not path.is_file():
                  raise SystemExit(f"restored frozen archive missing: {filename}")
          print("PASS restored frozen SEC snapshot from workflow run 32946731464")
          PY

      - name: Re-materialize benchmark issuer identities and denominators
        id: equity
        if: ${{ steps.restore.outcome == 'skipped' }}
        continue-on-error: true
        run: python -m scripts.download_sec_equity_v2 --root "$GITHUB_WORKSPACE"

      - name: Freeze authoritative SEC 13F archives
        id: freeze
        if: ${{ steps.restore.outcome == 'skipped' }}
        continue-on-error: true
        run: python -m scripts.acquire_sec13f_bpop_golden --root "$GITHUB_WORKSPACE"

      - name: Certify bounded BPOP eight-quarter corpus
        id: certify
        if: ${{ steps.restore.outcome == 'success' || (steps.equity.outcome == 'success' && steps.freeze.outcome == 'success') }}
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts/sec-ownership-golden-data-audit
          python -m scripts.certify_bpop_sec13f_8q --root "$GITHUB_WORKSPACE" 2>&1 \
            | tee artifacts/sec-ownership-golden-data-audit/certify.log

      - name: Record audit outcome
        if: always()
        shell: bash
        run: |
          mkdir -p artifacts/sec-ownership-golden-data-audit
          cat > artifacts/sec-ownership-golden-data-audit/workflow-state.json <<EOF
          {
            "restored_snapshot": "${{ steps.restore.outcome }}",
            "equity": "${{ steps.equity.outcome }}",
            "freeze": "${{ steps.freeze.outcome }}",
            "certify": "${{ steps.certify.outcome }}",
            "snapshot_source_run_id": "32946731464",
            "snapshot_artifact_id": "9598537414",
            "snapshot_payload_identity": "PINNED_MANIFEST_AND_SEC_EQUITY_FILE_SHA256",
            "claim": "AUDIT_ONLY_UNTIL_CERTIFICATION_JSON_STATE_PASS"
          }
          EOF
          find data/manifests -type f -maxdepth 4 -print 2>/dev/null || true

      - name: Upload frozen SEC evidence and manifests
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sec-ownership-bpop-8q-audit
          path: |
            artifacts/sec-ownership-golden-data-audit
            data/manifests/sec_equity_v2
            data/manifests/capital_control
            data/staging/processed/pr_sec_companies_v2.csv
            data/staging/processed/pr_sec_financials_v2.csv
            data/staging/processed/pr_sec_share_denominators_v2.csv
            data/staging/processed/capital_control/sec13f_pr_golden_holdings.csv
            data/staging/processed/capital_control/sec13f_pr_golden_excluded_periods.csv
            data/staging/processed/capital_control/sec13f_pr_golden_investors.csv
            data/staging/processed/capital_control/sec13f_holder_name_manifestations.csv
          if-no-files-found: warn
          retention-days: 90

      - name: Enforce bounded certification gate
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.certify.outcome }}" = "success"
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("data/manifests/capital_control/bpop_sec13f_8q_certification.json")
          if not path.is_file():
              raise SystemExit("certification artifact missing")
          payload = json.loads(path.read_text(encoding="utf-8"))
          if payload.get("state") != "PASS":
              raise SystemExit(f"certification state is {payload.get('state')!r}, expected 'PASS'")
          gates = payload.get("gates", {})
          failed = sorted(key for key, value in gates.items() if value is not True)
          if failed:
              raise SystemExit(f"certification has non-PASS gates: {failed}")
          print("PASS BPOP_SEC13F_8Q_v1 bounded certification")
          PY
