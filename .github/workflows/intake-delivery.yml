name: Intake Delivery (manual)

on:
  workflow_dispatch:
    inputs:
      raw_intake_path:
        description: Raw intake JSONL/JSON/CSV to route
        required: false
        default: tests/fixtures/pr_intake_router_sample.jsonl

permissions:
  contents: write
  pull-requests: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deliver:
    runs-on: ubuntu-latest
    env:
      RAW_PATH: ${{ inputs.raw_intake_path }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
          cache: pip
      - name: Assert isolated checkout
        run: test ! -e "$GITHUB_WORKSPACE/../thehub-pr"
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          test ! -e "$GITHUB_WORKSPACE/../thehub-pr"
      - name: Route raw intake
        run: python3 scripts/route_pr_intake.py --input "$RAW_PATH" --out-dir data/exports/pr_intake_router
      - name: Normalize moneysweep-pr finance lane
        run: python3 scripts/build_moneysweep_finance_lane.py --input data/exports/pr_intake_router --out .
      - name: Open same-repo PR with normalized finance tables
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: intake/finance-lane-update
          title: "Intake: politics/finance lane update"
          commit-message: "Intake delivery: normalized finance lane"
          body: Automated finance-lane normalization from the PR-intake router.
          add-paths: |
            data/normalized/*.csv
            data/review/*.csv
            reports/daily/politics_finance_update_report.md
