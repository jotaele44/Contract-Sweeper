name: Government change branch autofix

on:
  push:
    branches:
      - feature/government-entity-change-monitor

permissions:
  contents: write

jobs:
  reconcile-format-and-regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/government-entity-change-monitor
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Install deterministic formatter dependencies
        run: python -m pip install ruff==0.15.21 PyYAML==6.0.3
      - name: Merge audited upstream and reconcile capability manifest
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          set +e
          git merge --no-ff --no-commit origin/main
          merge_rc=$?
          set -e
          if [ "$merge_rc" -ne 0 ]; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            if [ "${#conflicts[@]}" -ne 1 ] || [ "${conflicts[0]}" != '.federation/gui-capabilities.json' ]; then
              printf 'Unexpected merge conflicts:\n'
              printf '%s\n' "${conflicts[@]}"
              exit 1
            fi
            git checkout --ours .federation/gui-capabilities.json
          fi
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          path = Path('.federation/gui-capabilities.json')
          ours = json.loads(path.read_text(encoding='utf-8'))
          upstream = json.loads(
              subprocess.check_output(
                  ['git', 'show', 'origin/main:.federation/gui-capabilities.json'],
                  text=True,
              )
          )
          ours_by_id = {row['id']: row for row in ours['capabilities']}
          upstream_by_id = {row['id']: row for row in upstream['capabilities']}
          staged_id = 'postmerge-staged-analysis-and-api-surfaces'
          if staged_id not in upstream_by_id:
              raise SystemExit('audited upstream staged capability missing')
          if staged_id not in ours_by_id:
              ours['capabilities'].append(upstream_by_id[staged_id])

          gov = next(
              row for row in ours['capabilities']
              if row['id'] == 'government-entity-change-monitor'
          )
          backend_files = gov['backend']['files']
          for item in [
              'moneysweep/government_change_materialization.py',
              'moneysweep/update_controller/executor.py',
          ]:
              if item not in backend_files:
                  backend_files.append(item)
          endpoints = gov['backend']['endpoints']
          candidate_endpoint = 'GET /government-changes/candidates'
          if candidate_endpoint not in endpoints:
              endpoints.insert(1, candidate_endpoint)
          components = gov['frontend']['components']
          candidate_component = 'dashboard/src/components/GovernmentChangeCandidates.jsx'
          if candidate_component not in components:
              components.append(candidate_component)
          backend_tests = gov['tests']['backend']
          materialization_test = 'tests/test_org_change_materialization.py'
          if materialization_test not in backend_tests:
              backend_tests.append(materialization_test)

          path.write_text(json.dumps(ours, indent=2) + '\n', encoding='utf-8')
          PY
          git add .federation/gui-capabilities.json
      - name: Apply canonical deterministic transforms
        run: |
          python scripts/regenerate_registry_json.py
          ruff format \
            moneysweep/government_change_detection.py \
            moneysweep/government_change_materialization.py \
            moneysweep/government_changes.py \
            moneysweep/update_controller/executor.py \
            server/backend/government_changes.py \
            tests/test_org_change_materialization.py \
            tests/test_org_change_monitor.py
          git add \
            registries/government_entity_registry.json \
            moneysweep/government_change_detection.py \
            moneysweep/government_change_materialization.py \
            moneysweep/government_changes.py \
            moneysweep/update_controller/executor.py \
            server/backend/government_changes.py \
            tests/test_org_change_materialization.py \
            tests/test_org_change_monitor.py
      - name: Commit reconciled tree
        run: |
          if git diff --cached --quiet && [ ! -f .git/MERGE_HEAD ]; then
            echo 'No deterministic fixes or upstream merge required.'
            exit 0
          fi
          git commit -m 'merge: reconcile audited GUI parity upstream'
          git push origin HEAD:feature/government-entity-change-monitor
