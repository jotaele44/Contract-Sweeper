name: Temporary source workflow validator

on:
  push:
    branches:
      - agent/moneysweep-certified-fail-closed-v0-4
    paths:
      - .github/workflows/materialize-sources.yml
      - .github/workflows/highergov-fetch.yml
      - .github/workflows/sam-opportunities-fetch.yml
      - .github/workflows/temp-source-workflow-validator.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/materialize-sources.yml
      - .github/workflows/highergov-fetch.yml
      - .github/workflows/sam-opportunities-fetch.yml
      - .github/workflows/temp-source-workflow-validator.yml

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Install actionlint v1.7.7
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .bin
          GOBIN="$PWD/.bin" go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          .bin/actionlint -version

      - name: Validate workflow syntax
        shell: bash
        run: |
          set -euo pipefail
          .bin/actionlint \
            .github/workflows/materialize-sources.yml \
            .github/workflows/highergov-fetch.yml \
            .github/workflows/sam-opportunities-fetch.yml \
            .github/workflows/temp-source-workflow-validator.yml

      - name: Verify temporary validation scope and prohibited expressions
        env:
          BASE_SHA: 34ef3b9352493d0b6ba4eb821d7ea544bec0933b
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only "$BASE_SHA"...HEAD | sort)
          expected=(
            .github/workflows/highergov-fetch.yml
            .github/workflows/materialize-sources.yml
            .github/workflows/sam-opportunities-fetch.yml
            .github/workflows/temp-source-workflow-validator.yml
          )
          if [[ "${changed[*]}" != "${expected[*]}" ]]; then
            printf 'Unexpected scope:\n'
            printf '  %s\n' "${changed[@]}"
            exit 1
          fi
          if grep -RFn 'toLower(' \
            .github/workflows/materialize-sources.yml \
            .github/workflows/highergov-fetch.yml \
            .github/workflows/sam-opportunities-fetch.yml; then
            exit 1
          fi
          if grep -REn '^\s*if:.*secrets\.' \
            .github/workflows/materialize-sources.yml \
            .github/workflows/highergov-fetch.yml \
            .github/workflows/sam-opportunities-fetch.yml; then
            exit 1
          fi

      - name: Run deterministic fail-closed gate and receipt matrix
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p validation-evidence
          python3 - <<'PY'
          import json
          from pathlib import Path

          def materialize(confirm: str, dry_run: bool):
              authorized = False
              mode = "confirmation-missing"
              if confirm.upper() == "YES":
                  if dry_run:
                      mode = "dry-run"
                  else:
                      authorized = True
                      mode = "live"
              return authorized, mode

          def highergov(confirm: str, secondary: str, dry_run: bool, secret_present: bool):
              authorized = False
              mode = "confirmation-missing"
              if confirm.upper() == "YES" and secondary.upper() == "FETCH":
                  if dry_run:
                      mode = "dry-run"
                  elif not secret_present:
                      mode = "missing-secret"
                  else:
                      authorized = True
                      mode = "live"
              return authorized, mode

          def sam(confirm: str, secondary: str, dry_run: bool, days: str, secret_present: bool):
              authorized = False
              mode = "confirmation-missing"
              if not days.isdigit() or not 1 <= int(days) <= 3650:
                  mode = "invalid-days"
              if mode != "invalid-days" and confirm.upper() == "YES" and secondary.upper() == "FETCH":
                  if dry_run:
                      mode = "dry-run"
                  elif not secret_present:
                      mode = "missing-secret"
                  else:
                      authorized = True
                      mode = "live"
              return authorized, mode

          cases = {
              "materialize_default": materialize("no", True),
              "materialize_mixed_case_dry": materialize("yEs", True),
              "highergov_default": highergov("no", "no", True, False),
              "highergov_mixed_case_dry": highergov("YeS", "fEtCh", True, True),
              "highergov_missing_secret": highergov("YES", "FETCH", False, False),
              "sam_default": sam("no", "no", True, "365", False),
              "sam_mixed_case_dry": sam("yEs", "FeTcH", True, "365", True),
              "sam_missing_secret": sam("YES", "FETCH", False, "365", False),
              "sam_invalid_zero": sam("YES", "FETCH", True, "0", True),
              "sam_invalid_high": sam("YES", "FETCH", True, "3651", True),
              "sam_invalid_text": sam("YES", "FETCH", True, "abc", True),
          }
          expected = {
              "materialize_default": (False, "confirmation-missing"),
              "materialize_mixed_case_dry": (False, "dry-run"),
              "highergov_default": (False, "confirmation-missing"),
              "highergov_mixed_case_dry": (False, "dry-run"),
              "highergov_missing_secret": (False, "missing-secret"),
              "sam_default": (False, "confirmation-missing"),
              "sam_mixed_case_dry": (False, "dry-run"),
              "sam_missing_secret": (False, "missing-secret"),
              "sam_invalid_zero": (False, "invalid-days"),
              "sam_invalid_high": (False, "invalid-days"),
              "sam_invalid_text": (False, "invalid-days"),
          }
          assert cases == expected, (cases, expected)

          receipts = {
              name: {
                  "schemaVersion": "1.0.0",
                  "workflow": name.split("_")[0],
                  "authorized": result[0],
                  "mode": result[1],
                  "liveFetchAuthorized": result[0],
              }
              for name, result in cases.items()
          }
          forbidden = {"secret", "apiKey", "token", "secretPresent", "secret_present"}
          for receipt in receipts.values():
              assert not forbidden.intersection(receipt)
          assert all(
              not receipt["liveFetchAuthorized"]
              for key, receipt in receipts.items()
              if "dry" in key or "default" in key
          )

          ledger = {
              "schemaVersion": "1.0.0",
              "headSha": "${{ github.event.pull_request.head.sha }}",
              "actionlintVersion": "1.7.7",
              "cases": {
                  key: {"authorized": value[0], "mode": value[1]}
                  for key, value in cases.items()
              },
              "receipts": receipts,
              "noSecretsPublished": True,
              "noLiveFetchExecuted": True,
          }
          Path("validation-evidence/gate-receipt-ledger.json").write_text(
              json.dumps(ledger, indent=2) + "\n", encoding="utf-8"
          )
          PY

      - name: Set up Python 3.13 for materialization dry run
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
          cache: pip

      - name: Install materialization dependencies
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d ../thehub-pr ]; then
            git clone --depth 1 --branch "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" https://github.com/jotaele44/thehub-pr.git ../thehub-pr || \
              git clone --depth 1 https://github.com/jotaele44/thehub-pr.git ../thehub-pr
          fi
          python -m pip install -r requirements.txt

      - name: Run actual materialization dry run
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/run_automatable_sources.py --dry-run
          python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path("data/staging/materialization_run_summary.json")
          payload = json.loads(path.read_text(encoding="utf-8"))
          assert payload.get("dry_run") is True, payload
          assert payload.get("ran") == [], payload
          Path("validation-evidence/materialization-dry-run-summary.json").write_text(
              json.dumps(payload, indent=2) + "\n", encoding="utf-8"
          )
          PY

      - name: Upload validation evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: source-workflow-validation-${{ github.run_id }}
          path: validation-evidence
          if-no-files-found: error
          retention-days: 30
