name: Temporary source workflow validator

on:
  push:
    branches:
      - agent/moneysweep-certified-fail-closed-v0-4
    paths:
      - .github/workflows/materialize-sources.yml
      - .github/workflows/highergov-fetch.yml
      - .github/workflows/sam-opportunities-fetch.yml
      - .github/workflows/temp-source-workflow-validator.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/materialize-sources.yml
      - .github/workflows/highergov-fetch.yml
      - .github/workflows/sam-opportunities-fetch.yml
      - .github/workflows/temp-source-workflow-validator.yml

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Install actionlint v1.7.7
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .bin
          GOBIN="$PWD/.bin" go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          .bin/actionlint -version

      - name: Validate workflow syntax
        shell: bash
        run: |
          set -euo pipefail
          .bin/actionlint \
            .github/workflows/materialize-sources.yml \
            .github/workflows/highergov-fetch.yml \
            .github/workflows/sam-opportunities-fetch.yml \
            .github/workflows/temp-source-workflow-validator.yml

      - name: Verify scope and prohibited expressions
        env:
          BASE_SHA: 34ef3b9352493d0b6ba4eb821d7ea544bec0933b
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only "$BASE_SHA"...HEAD | sort)
          expected=(
            .github/workflows/highergov-fetch.yml
            .github/workflows/materialize-sources.yml
            .github/workflows/sam-opportunities-fetch.yml
            .github/workflows/temp-source-workflow-validator.yml
          )
          if [[ "${changed[*]}" != "${expected[*]}" ]]; then
            printf 'Unexpected scope:\n'
            printf '  %s\n' "${changed[@]}"
            exit 1
          fi
          if grep -RFn 'toLower(' \
            .github/workflows/materialize-sources.yml \
            .github/workflows/highergov-fetch.yml \
            .github/workflows/sam-opportunities-fetch.yml; then
            exit 1
          fi
          if grep -REn '^\s*if:.*secrets\.' \
            .github/workflows/materialize-sources.yml \
            .github/workflows/highergov-fetch.yml \
            .github/workflows/sam-opportunities-fetch.yml; then
            exit 1
          fi
          if grep -Fn '10#' .github/workflows/sam-opportunities-fetch.yml; then
            exit 1
          fi
          grep -Fq 'len(raw) > 4' .github/workflows/sam-opportunities-fetch.yml
          grep -Fq 'raw.isascii()' .github/workflows/sam-opportunities-fetch.yml

      - name: Run complete fail-closed and overflow regression matrix
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p validation-evidence
          python3 - <<'PY'
          import json
          from pathlib import Path

          def parse_days(raw: str):
              if not raw.isascii() or not raw.isdigit() or len(raw) > 4:
                  return None
              value = int(raw, 10)
              return value if 1 <= value <= 3650 else None

          def materialize(confirm: str, dry_run: bool):
              if confirm.upper() != "YES":
                  return False, "confirmation-missing"
              if dry_run:
                  return False, "dry-run"
              return True, "live"

          def highergov(confirm: str, secondary: str, dry_run: bool, secret_present: bool):
              if confirm.upper() != "YES" or secondary.upper() != "FETCH":
                  return False, "confirmation-missing"
              if dry_run:
                  return False, "dry-run"
              if not secret_present:
                  return False, "missing-secret"
              return True, "live"

          def sam(confirm: str, secondary: str, dry_run: bool, days: str, secret_present: bool):
              parsed_days = parse_days(days)
              if parsed_days is None:
                  return False, "invalid-days", None
              if confirm.upper() != "YES" or secondary.upper() != "FETCH":
                  return False, "confirmation-missing", parsed_days
              if dry_run:
                  return False, "dry-run", parsed_days
              if not secret_present:
                  return False, "missing-secret", parsed_days
              return True, "live", parsed_days

          cases = {
              "materialize_default": materialize("no", True),
              "materialize_confirmed_dry": materialize("yEs", True),
              "highergov_default": highergov("no", "no", True, False),
              "highergov_confirmed_dry": highergov("YeS", "fEtCh", True, True),
              "highergov_missing_secret": highergov("YES", "FETCH", False, False),
              "sam_boundary_1": sam("YES", "FETCH", True, "1", True),
              "sam_boundary_3650": sam("YES", "FETCH", True, "3650", True),
              "sam_invalid_zero": sam("YES", "FETCH", True, "0", True),
              "sam_invalid_high": sam("YES", "FETCH", True, "3651", True),
              "sam_invalid_text": sam("YES", "FETCH", True, "abc", True),
              "sam_overflow_uint64": sam("YES", "FETCH", False, "18446744073709551617", True),
              "sam_overflow_extreme": sam("YES", "FETCH", False, "999999999999999999999999999999999999", True),
              "sam_overlong_leading_zero": sam("YES", "FETCH", False, "0000000000000000000000000000000000003650", True),
              "sam_missing_secret": sam("YES", "FETCH", False, "365", False),
          }

          expected = {
              "materialize_default": (False, "confirmation-missing"),
              "materialize_confirmed_dry": (False, "dry-run"),
              "highergov_default": (False, "confirmation-missing"),
              "highergov_confirmed_dry": (False, "dry-run"),
              "highergov_missing_secret": (False, "missing-secret"),
              "sam_boundary_1": (False, "dry-run", 1),
              "sam_boundary_3650": (False, "dry-run", 3650),
              "sam_invalid_zero": (False, "invalid-days", None),
              "sam_invalid_high": (False, "invalid-days", None),
              "sam_invalid_text": (False, "invalid-days", None),
              "sam_overflow_uint64": (False, "invalid-days", None),
              "sam_overflow_extreme": (False, "invalid-days", None),
              "sam_overlong_leading_zero": (False, "invalid-days", None),
              "sam_missing_secret": (False, "missing-secret", 365),
          }
          assert cases == expected, (cases, expected)

          overflow_keys = {
              "sam_overflow_uint64",
              "sam_overflow_extreme",
              "sam_overlong_leading_zero",
          }
          for key in overflow_keys:
              authorized, mode, receipt_days = cases[key]
              assert authorized is False
              assert mode == "invalid-days"
              assert receipt_days is None

          receipts = {}
          for name, result in cases.items():
              authorized = result[0]
              mode = result[1]
              receipt = {
                  "schemaVersion": "1.0.0",
                  "workflow": name.split("_")[0],
                  "authorized": authorized,
                  "mode": mode,
                  "liveFetchAuthorized": authorized,
              }
              if name.startswith("sam_"):
                  receipt["days"] = result[2]
              receipts[name] = receipt

          forbidden = {"secret", "apiKey", "token", "secretPresent", "secret_present"}
          for receipt in receipts.values():
              assert not forbidden.intersection(receipt)
          assert all(not receipts[key]["liveFetchAuthorized"] for key in overflow_keys)

          ledger = {
              "schemaVersion": "1.1.0",
              "headSha": "${{ github.event.pull_request.head.sha || github.sha }}",
              "actionlintVersion": "1.7.7",
              "cases": {
                  key: {
                      "authorized": value[0],
                      "mode": value[1],
                      **({"days": value[2]} if key.startswith("sam_") else {}),
                  }
                  for key, value in cases.items()
              },
              "receipts": receipts,
              "overflowRegressionCount": len(overflow_keys),
              "noSecretsPublished": True,
              "noLiveFetchExecuted": True,
          }
          Path("validation-evidence/gate-receipt-ledger.json").write_text(
              json.dumps(ledger, indent=2) + "\n", encoding="utf-8"
          )
          PY

      - name: Set up Python 3.13 for materialization dry run
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install materialization dependencies
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d ../thehub-pr ]; then
            git clone --depth 1 --branch "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" https://github.com/jotaele44/thehub-pr.git ../thehub-pr || \
              git clone --depth 1 https://github.com/jotaele44/thehub-pr.git ../thehub-pr
          fi
          python -m pip install -r requirements.txt

      - name: Run actual materialization dry run
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/run_automatable_sources.py --dry-run
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path("data/staging/materialization_run_summary.json")
          payload = json.loads(path.read_text(encoding="utf-8"))
          assert payload.get("dry_run") is True, payload
          assert payload.get("ran") == [], payload
          Path("validation-evidence/materialization-dry-run-summary.json").write_text(
              json.dumps(payload, indent=2) + "\n", encoding="utf-8"
          )
          PY

      - name: Upload validation evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: source-workflow-validation-${{ github.run_id }}
          path: validation-evidence
          if-no-files-found: error
