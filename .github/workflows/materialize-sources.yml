name: Materialize automatable sources

# Live/API fetch for the automatable financial-source set. Runs on an egress-capable
# GitHub Actions runner. Preflight is the safe default and never executes producers.
# Live outputs are uploaded as artifacts and are never committed.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "preflight validates controls; fetch executes live producers"
        required: true
        type: choice
        options:
          - preflight
          - fetch
        default: preflight
      confirm:
        description: "For fetch mode only, type exactly YES"
        required: false
        default: "no"
      source:
        description: "Optional single source id (letters, digits, . _ -)"
        required: false
        default: ""
      family:
        description: "Optional family filter (letters, digits, . _ -)"
        required: false
        default: ""

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate_dispatch:
    name: Validate bounded dispatch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Validate confirmation and bounded arguments
        env:
          DISPATCH_MODE: ${{ github.event.inputs.mode }}
          DISPATCH_CONFIRM: ${{ github.event.inputs.confirm }}
          DISPATCH_SOURCE: ${{ github.event.inputs.source }}
          DISPATCH_FAMILY: ${{ github.event.inputs.family }}
        run: |
          python3 scripts/validate_live_fetch_dispatch.py \
            --workflow materialize-sources \
            --mode "$DISPATCH_MODE" \
            --confirm "$DISPATCH_CONFIRM" \
            --source "$DISPATCH_SOURCE" \
            --family "$DISPATCH_FAMILY"

      - name: Compile producer entry point without importing dependencies
        run: python3 -m py_compile scripts/run_automatable_sources.py

  materialize:
    name: Run automatable sources (live)
    needs: validate_dispatch
    if: github.event.inputs.mode == 'fetch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          if [ ! -d ../thehub-pr ]; then
            git clone --depth 1 --branch "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" \
              https://github.com/jotaele44/thehub-pr.git ../thehub-pr \
              || git clone --depth 1 https://github.com/jotaele44/thehub-pr.git ../thehub-pr
          fi
          pip install -r requirements.txt

      - name: Egress preflight
        run: python3 scripts/check_network_egress.py

      - name: Run bounded automatable source selection
        env:
          SAM_API_KEY: ${{ secrets.SAM_API_KEY }}
          FEC_API_KEY: ${{ secrets.FEC_API_KEY }}
          FAC_API_KEY: ${{ secrets.FAC_API_KEY }}
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
          LDA_API_KEY: ${{ secrets.LDA_API_KEY }}
          DATA_GOV_API_KEY: ${{ secrets.DATA_GOV_API_KEY }}
          HIGHERGOV_API_KEY: ${{ secrets.HIGHERGOV_API_KEY }}
          OPENCORPORATES_API_TOKEN: ${{ secrets.OPENCORPORATES_API_TOKEN }}
          FINANCIALDATA_API_KEY: ${{ secrets.FINANCIALDATA_API_KEY }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          DISPATCH_SOURCE: ${{ github.event.inputs.source }}
          DISPATCH_FAMILY: ${{ github.event.inputs.family }}
        run: |
          args=()
          if [ -n "$DISPATCH_SOURCE" ]; then
            args+=(--source "$DISPATCH_SOURCE")
          fi
          if [ -n "$DISPATCH_FAMILY" ]; then
            args+=(--family "$DISPATCH_FAMILY")
          fi
          python3 scripts/run_automatable_sources.py "${args[@]}"

      - name: Upload materialized outputs and run summary
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: materialized-sources
          path: |
            data/staging/processed
            data/staging/materialization_run_summary.json
          if-no-files-found: ignore
