name: Materialize automatable sources

# Live/API fetch for the automatable financial-source set. Runs on an egress-capable
# GitHub Actions runner. Manual-only by default. Outputs are uploaded as artifacts,
# never committed (data-commit policy: data/** is gitignored).

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type 'YES' (case-insensitive) to confirm source execution"
        required: true
        default: "no"
      dry_run:
        description: "List the selected sources without live/API fetches"
        required: true
        type: boolean
        default: true
      source:
        description: "Optional single source id (blank = all automatable)"
        required: false
        default: ""
      family:
        description: "Optional family filter (blank = all)"
        required: false
        default: ""
  # schedule:
  #   - cron: "0 6 * * 1"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  materialize:
    name: Run automatable sources
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate fail-closed dispatch gate
        id: gate
        shell: bash
        env:
          CONFIRM: ${{ inputs.confirm }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          authorized=false
          mode=confirmation-missing
          if [[ "${CONFIRM^^}" == "YES" ]]; then
            if [[ "$DRY_RUN" == "true" ]]; then
              mode=dry-run
            else
              authorized=true
              mode=live
            fi
          fi
          echo "authorized=$authorized" >> "$GITHUB_OUTPUT"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: ${{ steps.gate.outputs.mode == 'dry-run' || steps.gate.outputs.authorized == 'true' }}

      - name: Set up Python
        if: ${{ steps.gate.outputs.mode == 'dry-run' || steps.gate.outputs.authorized == 'true' }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        if: ${{ steps.gate.outputs.mode == 'dry-run' || steps.gate.outputs.authorized == 'true' }}
        run: |
          if [ ! -d ../thehub-pr ]; then
            git clone --depth 1 --branch "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" https://github.com/jotaele44/thehub-pr.git ../thehub-pr || \
              git clone --depth 1 https://github.com/jotaele44/thehub-pr.git ../thehub-pr
          fi
          pip install -r requirements.txt

      - name: Enumerate selected sources without live fetches
        if: ${{ steps.gate.outputs.mode == 'dry-run' }}
        env:
          SOURCE: ${{ inputs.source }}
          FAMILY: ${{ inputs.family }}
        run: |
          args=(--dry-run)
          if [[ -n "$SOURCE" ]]; then args+=(--source "$SOURCE"); fi
          if [[ -n "$FAMILY" ]]; then args+=(--family "$FAMILY"); fi
          python3 scripts/run_automatable_sources.py "${args[@]}"

      - name: Egress preflight
        if: ${{ steps.gate.outputs.authorized == 'true' }}
        run: python3 scripts/check_network_egress.py

      - name: Run automatable sources (live fetch)
        if: ${{ steps.gate.outputs.authorized == 'true' }}
        env:
          SAM_API_KEY: ${{ secrets.SAM_API_KEY }}
          FEC_API_KEY: ${{ secrets.FEC_API_KEY }}
          FAC_API_KEY: ${{ secrets.FAC_API_KEY }}
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
          LDA_API_KEY: ${{ secrets.LDA_API_KEY }}
          DATA_GOV_API_KEY: ${{ secrets.DATA_GOV_API_KEY }}
          HIGHERGOV_API_KEY: ${{ secrets.HIGHERGOV_API_KEY }}
          OPENCORPORATES_API_TOKEN: ${{ secrets.OPENCORPORATES_API_TOKEN }}
          FINANCIALDATA_API_KEY: ${{ secrets.FINANCIALDATA_API_KEY }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          SOURCE: ${{ inputs.source }}
          FAMILY: ${{ inputs.family }}
        run: |
          args=()
          if [[ -n "$SOURCE" ]]; then args+=(--source "$SOURCE"); fi
          if [[ -n "$FAMILY" ]]; then args+=(--family "$FAMILY"); fi
          python3 scripts/run_automatable_sources.py "${args[@]}"

      - name: Upload materialized outputs and run summary
        if: ${{ always() && (steps.gate.outputs.mode == 'dry-run' || steps.gate.outputs.authorized == 'true') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: materialized-sources-${{ github.run_id }}
          path: |
            data/staging/processed
            data/staging/materialization_run_summary.json
          if-no-files-found: ignore

      - name: Write redacted dispatch receipt
        if: ${{ always() }}
        env:
          AUTHORIZED: ${{ steps.gate.outputs.authorized }}
          MODE: ${{ steps.gate.outputs.mode }}
          SOURCE: ${{ inputs.source }}
          FAMILY: ${{ inputs.family }}
        run: |
          mkdir -p dispatch-receipt
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          Path("dispatch-receipt/materialize-sources.json").write_text(
              json.dumps({
                  "schemaVersion": "1.0.0",
                  "workflow": "materialize-sources",
                  "authorized": os.environ.get("AUTHORIZED") == "true",
                  "mode": os.environ.get("MODE", "gate-unavailable"),
                  "source": os.environ.get("SOURCE", ""),
                  "family": os.environ.get("FAMILY", ""),
                  "liveFetchAuthorized": os.environ.get("AUTHORIZED") == "true",
              }, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload dispatch receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: materialize-sources-dispatch-receipt-${{ github.run_id }}
          path: dispatch-receipt/materialize-sources.json
          if-no-files-found: error
