name: Source update — dispatch

on:
  workflow_dispatch:
    inputs:
      source_id:
        description: "Single source id to run (blank = use cadence)"
        required: false
        default: ""
      cadence:
        description: "Cadence to run when source_id is blank (weekly/monthly/quarterly/yearly)"
        required: false
        default: ""
      dry_run:
        description: "Plan only, run nothing"
        required: false
        default: "false"
      continue_on_error:
        description: "Isolate per-source failures and keep going"
        required: false
        default: "true"
      run_dependents:
        description: "Trigger dependents after a changed run"
        required: false
        default: "true"

permissions:
  contents: read

concurrency:
  group: source-update-dispatch
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  dispatch:
    name: Dispatch run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
          cache: pip
      - name: Assert isolated checkout
        run: test ! -e "$GITHUB_WORKSPACE/../thehub-pr"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          test ! -e "$GITHUB_WORKSPACE/../thehub-pr"
      - name: Validate policy
        run: python3 scripts/update_sources.py validate-policy
      - name: Validate source_id against the registry
        if: ${{ github.event.inputs.source_id != '' }}
        env:
          SOURCE_ID: ${{ github.event.inputs.source_id }}
        run: |
          python3 - <<'PY'
          import os
          import sys
          from moneysweep.runtime.source_registry import source_by_id
          sid = os.environ["SOURCE_ID"]
          if source_by_id(sid) is None:
              print(f"unknown source_id: {sid}", file=sys.stderr)
              raise SystemExit(2)
          print(f"source_id ok: {sid}")
          PY
      - name: Strict preflight
        run: python3 run_all.py --only-setup --strict-preflight
      - name: Dispatch run
        env:
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          FAC_API_KEY: ${{ secrets.FAC_API_KEY }}
          FEC_API_KEY: ${{ secrets.FEC_API_KEY }}
          FINANCIALDATA_API_KEY: ${{ secrets.FINANCIALDATA_API_KEY }}
          FINANCIALDATA_LICENSE_APPROVED: ${{ secrets.FINANCIALDATA_LICENSE_APPROVED }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          HIGHERGOV_API_KEY: ${{ secrets.HIGHERGOV_API_KEY }}
          OPENSTATES_API_KEY: ${{ secrets.OPENSTATES_API_KEY }}
          SAM_API_KEY: ${{ secrets.SAM_API_KEY }}
          SOURCE_ID: ${{ github.event.inputs.source_id }}
          CADENCE: ${{ github.event.inputs.cadence }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          CONTINUE_ON_ERROR: ${{ github.event.inputs.continue_on_error }}
          RUN_DEPENDENTS: ${{ github.event.inputs.run_dependents }}
        run: |
          args=(run)
          if [ -n "$SOURCE_ID" ]; then
            args+=(--source "$SOURCE_ID")
          elif [ -n "$CADENCE" ]; then
            args+=(--cadence "$CADENCE")
          fi
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          if [ "$CONTINUE_ON_ERROR" = "true" ]; then args+=(--continue-on-error); fi
          if [ "$RUN_DEPENDENTS" != "true" ]; then args+=(--no-dependents); fi
          python3 scripts/update_sources.py "${args[@]}" --json
      - name: Freshness report
        if: ${{ always() }}
        run: python3 scripts/update_sources.py freshness --json || true
      - name: Upload reports and outputs
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: source-update-dispatch
          path: |
            reports/source_freshness.csv
            reports/source_update_state.json
            reports/source_update_runs.local.jsonl
            reports/source_update_failures.local.jsonl
            data/staging/processed
          if-no-files-found: ignore
