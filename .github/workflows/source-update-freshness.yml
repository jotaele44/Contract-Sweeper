name: Source update — freshness

on:
  schedule:
    - cron: "47 10 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-update-freshness
  cancel-in-progress: false

jobs:
  freshness:
    name: Freshness report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
          cache: pip
      - name: Assert isolated checkout
        run: test ! -e "$GITHUB_WORKSPACE/../thehub-pr"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          test ! -e "$GITHUB_WORKSPACE/../thehub-pr"
      - name: Validate policy
        run: python3 scripts/update_sources.py validate-policy
      - name: Freshness report
        run: |
          set +e
          python3 scripts/update_sources.py freshness --json
          code=$?
          if [ "$code" -eq 2 ]; then exit 1; fi
          exit 0
      - name: Upload freshness report
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: source-update-freshness
          path: reports/source_freshness.csv
          if-no-files-found: ignore
