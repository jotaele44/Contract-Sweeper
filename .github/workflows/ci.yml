name: Contract Sweeper CI

on:
  pull_request:
  push:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
# Supersede older runs of this workflow on the same ref: a newer push
# makes the in-flight result irrelevant, so cancel it and free the runner.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile-and-test:
    name: Compile and pytest
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Validate federation manifest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path('federation.json').read_text())
          required = {
              'schema_version',
              'program_id',
              'repository_full_name',
              'hub_parent',
              'hub_callable_commands',
              'canonical_outputs',
              'federation_readiness_gate',
          }
          missing = sorted(required - set(manifest))
          if missing:
              raise SystemExit(f'missing federation manifest keys: {missing}')
          if manifest['program_id'] != 'moneysweep-pr':
              raise SystemExit(f"unexpected program_id: {manifest['program_id']}")
          if manifest['hub_parent'] != 'thehub-pr':
              raise SystemExit(f"unexpected hub_parent: {manifest['hub_parent']}")
          commands = manifest['hub_callable_commands']
          for key in ('setup', 'strict_preflight', 'full_pipeline', 'test_suite'):
              if key not in commands:
                  raise SystemExit(f'missing hub command: {key}')
          gate = manifest['federation_readiness_gate']
          if gate.get('ready_for_hub_discovery') is not True:
              raise SystemExit('ready_for_hub_discovery must be true')
          if not isinstance(gate.get('blocking_conditions'), list):
              raise SystemExit('blocking_conditions must be a list')
          PY

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          # PRII_FETCH_HUB: ensure shared federation libs resolve
          if [ ! -d ../thehub-pr ]; then git clone --depth 1 --branch "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" https://github.com/jotaele44/thehub-pr.git ../thehub-pr || git clone --depth 1 https://github.com/jotaele44/thehub-pr.git ../thehub-pr; fi
          python -m pip install -r requirements.txt

      - name: Compile modules
        run: python -m compileall moneysweep scripts tests

      - name: Run tests
        run: pytest -q

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

      - name: Scan for committed secrets
        run: python scripts/scan_for_secrets.py --root .

      - name: Run R5 validation gates (bootstrap mode)
        run: python -m moneysweep.runtime.validation_gates --root . --allow-failed

      - name: Validate Canonical Entity Relationship Model v1 (bootstrap mode)
        run: python -m moneysweep.validation.canonical_v1_schema --root . --allow-failed

  # Frontend gate. The dashboard package has shipped with a `lint` script, an eslint
  # config and a committed package-lock.json, but no CI job ran any of them —
  # the only workflow that built it was desktop-build.yml, which is tag- and
  # path-triggered and does not fire on a frontend-only PR. So a lint regression
  # or a broken build could merge unnoticed.
  #
  # Gates `lint` and `build`, matching skywatcher-pr and thehub-pr. `typecheck`
  # is deliberately not added here: this package has never had a JS gate, and
  # turning on two at once risks a red build over pre-existing findings.
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
