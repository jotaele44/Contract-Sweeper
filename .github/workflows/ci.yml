name: Contract Sweeper CI

on:
  pull_request:
  push:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile-and-test:
    name: Compile and pytest
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate federation manifest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path('federation.json').read_text())
          required = {
              'schema_version',
              'program_id',
              'repository_full_name',
              'hub_parent',
              'hub_callable_commands',
              'canonical_outputs',
              'federation_readiness_gate',
          }
          missing = sorted(required - set(manifest))
          if missing:
              raise SystemExit(f'missing federation manifest keys: {missing}')
          if manifest['program_id'] != 'moneysweep-pr':
              raise SystemExit(f"unexpected program_id: {manifest['program_id']}")
          if manifest['hub_parent'] != 'thehub-pr':
              raise SystemExit(f"unexpected hub_parent: {manifest['hub_parent']}")
          commands = manifest['hub_callable_commands']
          for key in ('setup', 'strict_preflight', 'full_pipeline', 'test_suite'):
              if key not in commands:
                  raise SystemExit(f'missing hub command: {key}')
          gate = manifest['federation_readiness_gate']
          if gate.get('ready_for_hub_discovery') is not True:
              raise SystemExit('ready_for_hub_discovery must be true')
          if not isinstance(gate.get('blocking_conditions'), list):
              raise SystemExit('blocking_conditions must be a list')
          PY

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Assert isolated checkout
        run: test ! -e "$GITHUB_WORKSPACE/../thehub-pr"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile modules
        run: python -m compileall moneysweep scripts tests

      - name: Run tests
        run: pytest -q

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

      - name: Scan for committed secrets
        run: python scripts/scan_for_secrets.py --root .

      - name: Run R5 validation gates (bootstrap mode)
        run: python -m moneysweep.runtime.validation_gates --root . --allow-failed

      - name: Validate Canonical Entity Relationship Model v1 (bootstrap mode)
        run: python -m moneysweep.validation.canonical_v1_schema --root . --allow-failed

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      # `test` is the vitest suite (src/**/*.test.{js,jsx}), which is distinct
      # from `test:pilot` — the node --test suite in dashboard/tests/ that
      # verify:pilot runs. vitest's include glob deliberately excludes it, so
      # the two never collect each other's files.
      - name: Tests
        run: npm run test
      - name: Build
        run: npm run build

  guide-live-freeze:
    name: Guide bounded live freeze (one-shot branch gate)
    if: ${{ github.event_name == 'push' && github.ref_name == 'audit/guide-financial-avenue-coverage-v1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact audit branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: audit/guide-financial-avenue-coverage-v1
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: One-shot preflight
        id: preflight
        shell: bash
        run: |
          if [[ -f reports/guide_financial_live_freeze_attempt_v1.json ]]; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "Live-freeze attempt already frozen; preserving prior manifestation."
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Canonically classify internal audit pipeline
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('.federation/gui-capabilities.json')
          manifest = json.loads(path.read_text(encoding='utf-8'))
          capability_id = 'guide-financial-avenue-audit-pipeline'
          existing = next(
              (item for item in manifest.get('capabilities', []) if item.get('id') == capability_id),
              None,
          )
          capability = {
              'id': capability_id,
              'classification': 'internal',
              'status': 'active',
              'requires_terminal': False,
              'rationale': (
                  'Bounded source-audit, immutable public-source materialization, and certification '
                  'receipt generation are CI/operator pipeline infrastructure rather than a separate '
                  'human-facing dashboard workflow.'
              ),
              'analysis': {
                  'files': [
                      'scripts/audit_guide_financial_avenues.py',
                      'scripts/finalize_guide_financial_freeze.py',
                      'scripts/scrape_ftz_board_pr.py',
                      'scripts/scrape_ocif_guide_financial_classes.py',
                      'scripts/scrape_ocs_insurers.py',
                  ],
              },
              'tests': {
                  'backend': [
                      'tests/test_guide_financial_avenue_audit.py',
                      'tests/test_guide_financial_source_parsers.py',
                  ]
              },
          }
          if existing is None:
              manifest.setdefault('capabilities', []).append(capability)
          else:
              existing.clear()
              existing.update(capability)
          path.write_text(json.dumps(manifest, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          PY

      - name: Materialize authoritative OCIF OCS FTZ surfaces
        if: ${{ steps.preflight.outputs.needed == 'true' }}
        id: materialize
        continue-on-error: true
        env:
          GUIDE_SOURCE_SNAPSHOT_DIR: data/raw/guide_financial_avenue_snapshots
        shell: bash
        run: |
          mkdir -p reports/guide_live_freeze_logs
          set +e
          python scripts/scrape_ocif_guide_financial_classes.py --force > reports/guide_live_freeze_logs/ocif.log 2>&1
          ocif=$?
          python scripts/scrape_ocs_insurers.py --force > reports/guide_live_freeze_logs/ocs.log 2>&1
          ocs=$?
          python scripts/scrape_ftz_board_pr.py --force > reports/guide_live_freeze_logs/ftz.log 2>&1
          ftz=$?
          set -e
          echo "ocif_exit=$ocif" >> "$GITHUB_OUTPUT"
          echo "ocs_exit=$ocs" >> "$GITHUB_OUTPUT"
          echo "ftz_exit=$ftz" >> "$GITHUB_OUTPUT"

      - name: Validate frozen manifestations and regenerate audit
        if: ${{ steps.preflight.outputs.needed == 'true' }}
        id: finalize
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python scripts/finalize_guide_financial_freeze.py \
            --snapshot-dir data/raw/guide_financial_avenue_snapshots \
            > reports/guide_live_freeze_logs/finalize.log 2>&1
          rc=$?
          set -e
          echo "exit=$rc" >> "$GITHUB_OUTPUT"

      - name: Freeze one-shot execution receipt
        if: ${{ steps.preflight.outputs.needed == 'true' }}
        env:
          OCIF_EXIT: ${{ steps.materialize.outputs.ocif_exit }}
          OCS_EXIT: ${{ steps.materialize.outputs.ocs_exit }}
          FTZ_EXIT: ${{ steps.materialize.outputs.ftz_exit }}
          FINALIZE_EXIT: ${{ steps.finalize.outputs.exit }}
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          logs = {}
          for path in sorted(Path('reports/guide_live_freeze_logs').glob('*.log')):
              data = path.read_bytes()
              logs[path.name] = {
                  'byte_size': len(data),
                  'sha256': hashlib.sha256(data).hexdigest(),
              }
          payload = {
              'schema_version': 'guide_financial_live_freeze_attempt_v1',
              'scope_id': 'GUIDE_BOUNDED_100_PERCENT',
              'completed_at_utc': datetime.now(timezone.utc).replace(microsecond=0).isoformat(),
              'head_sha': os.environ.get('GITHUB_SHA', ''),
              'exit_codes': {
                  'ocif': int(os.environ.get('OCIF_EXIT') or 999),
                  'ocs': int(os.environ.get('OCS_EXIT') or 999),
                  'ftz': int(os.environ.get('FTZ_EXIT') or 999),
                  'finalize': int(os.environ.get('FINALIZE_EXIT') or 999),
              },
              'logs': logs,
              'scope_limitation': 'GUIDE_BOUNDED_100_PERCENT != ALL_PUERTO_RICO_FINANCE',
          }
          Path('reports/guide_financial_live_freeze_attempt_v1.json').write_text(
              json.dumps(payload, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          PY

      - name: Commit immutable live-freeze evidence
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .federation/gui-capabilities.json
          git add -f data/raw/guide_financial_avenue_snapshots || true
          git add -f data/staging/processed/pr_ocif_guide_financial_classes.csv || true
          git add -f data/staging/processed/pr_ocs_insurers.csv || true
          git add -f data/staging/processed/pr_ocs_insurer_annual_reports.csv || true
          git add -f data/staging/processed/pr_ftz_zones_sites.csv || true
          git add reports/guide_financial_live_freeze_attempt_v1.json || true
          git add reports/guide_financial_live_freeze_v1.json || true
          git add reports/guide_bounded_100_percent_certification_v1.json || true
          git add reports/guide_financial_avenue_source_audit_v1.csv || true
          git add reports/guide_financial_avenue_matrix_v1.csv || true
          git add reports/guide_financial_avenue_set_metrics_v1.json || true
          git add reports/guide_live_freeze_logs || true
          if git diff --cached --quiet; then
            echo "No live-freeze changes to commit."
            exit 0
          fi
          git commit -m "audit: freeze live guide financial source manifestations"
          git push origin HEAD:audit/guide-financial-avenue-coverage-v1
