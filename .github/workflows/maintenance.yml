name: maintenance

# Audit-first maintenance for moneysweep-pr. Runs the maintenance tests and the
# audit-mode script, uploads the report as an artifact, and never auto-commits.

on:
  workflow_dispatch:
  schedule:
    - cron: "33 6 * * 1"   # Mondays 06:33 UTC

# Least privilege: this workflow only reads the repo (and uploads artifacts,
# which uses the runtime token, not GITHUB_TOKEN). Widen deliberately if a
# step ever needs to write back.
permissions:
  contents: read

# Serialise runs on the same ref without cancelling. This workflow can
# publish, write data, or hand off to another repo, and killing it
# mid-flight risks leaving that work half-done.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  maintenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: |
          # PRII_FETCH_HUB: ensure shared federation libs resolve
          if [ ! -d ../thehub-pr ]; then git clone --depth 1 --branch "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" https://github.com/jotaele44/thehub-pr.git ../thehub-pr || git clone --depth 1 https://github.com/jotaele44/thehub-pr.git ../thehub-pr; fi
          python -m pip install -r requirements.txt jsonschema
      - name: Maintenance tests
        run: python -m pytest tests/test_maintenance.py -q -o addopts=""
      - name: Audit run
        run: python3 scripts/run_maintenance.py --repo moneysweep-pr --mode audit --json
      - name: Upload maintenance report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: moneysweep-maintenance-report
          path: reports/maintenance/latest.json
          if-no-files-found: ignore
