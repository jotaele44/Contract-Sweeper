name: maintenance

on:
  workflow_dispatch:
  schedule:
    - cron: "33 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  maintenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
          cache: pip
      - name: Assert isolated checkout
        run: test ! -e "$GITHUB_WORKSPACE/../thehub-pr"
      - name: Install
        run: |
          python -m pip install -r requirements.txt jsonschema
          test ! -e "$GITHUB_WORKSPACE/../thehub-pr"
      - name: Maintenance tests
        run: python -m pytest tests/test_maintenance.py -q -o addopts=""
      - name: Audit run
        run: python3 scripts/run_maintenance.py --repo moneysweep-pr --mode audit --json
      - name: Upload maintenance report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: moneysweep-maintenance-report
          path: reports/maintenance/latest.json
          if-no-files-found: ignore
