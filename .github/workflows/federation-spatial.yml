name: Federation Spatial Contract

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  federation-spatial:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - name: Install validator dependencies
        run: python -m pip install jsonschema pytest
      - name: Validate spatial contracts
        run: python scripts/validate_federation_spatial.py
      - name: Run spatial contract tests
        run: >-
          python -m pytest -q --no-cov
          tests/test_federation_spatial_core.py
          tests/test_spatial_materializer.py
          tests/test_fedgeopack.py
          tests/test_validate_federation_spatial.py
