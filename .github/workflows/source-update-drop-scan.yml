name: Source update — drop scan

on:
  schedule:
    - cron: "53 10 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-update-drop-scan
  cancel-in-progress: false

jobs:
  scan:
    name: Scan committed dropzones
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
          cache: pip
      - name: Assert isolated checkout
        run: test ! -e "$GITHUB_WORKSPACE/../thehub-pr"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          test ! -e "$GITHUB_WORKSPACE/../thehub-pr"
      - name: Validate policy
        run: python3 scripts/update_sources.py validate-policy
      - name: Scan drops
        run: python3 scripts/update_sources.py scan-drops --json | tee reports/source_update_drop_scan.json
      - name: Upload drop-scan report
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: source-update-drop-scan
          path: reports/source_update_drop_scan.json
          if-no-files-found: ignore
