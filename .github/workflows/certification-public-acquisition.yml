name: Certification public acquisition

on:
  pull_request:
    paths:
      - ".github/workflows/certification-public-acquisition.yml"
      - "scripts/scrape_iapconsulta.py"
      - "scripts/download_cor3.py"
      - "scripts/build_unified_master.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-acquisition:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Acquire full OCPR corpus
        run: python scripts/scrape_iapconsulta.py --force
      - name: Rebuild unified USAspending-derived master from committed inputs
        run: python scripts/build_unified_master.py --force
      - name: Probe current COR3 producer fail-closed
        continue-on-error: true
        run: python scripts/download_cor3.py --force
      - name: Record acquisition evidence
        run: |
          python - <<'PY'
          import csv, hashlib, json
          from pathlib import Path
          paths = [
              Path("data/staging/processed/pr_contralor_audits.csv"),
              Path("data/staging/processed/pr_contracts_master.csv"),
              Path("data/staging/processed/pr_all_awards_master.csv"),
              Path("data/staging/processed/pr_cor3_projects.csv"),
          ]
          rows = []
          for p in paths:
              item = {"path": str(p), "exists": p.exists(), "bytes": p.stat().st_size if p.exists() else 0}
              if p.exists():
                  item["sha256"] = hashlib.sha256(p.read_bytes()).hexdigest()
                  try:
                      with p.open("r", encoding="utf-8-sig", newline="") as fh:
                          item["data_rows"] = max(sum(1 for _ in csv.reader(fh)) - 1, 0)
                  except Exception as exc:
                      item["row_error"] = str(exc)
              rows.append(item)
          out = Path("reports/certification_public_acquisition.json")
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps({"artifacts": rows}, indent=2) + "\n", encoding="utf-8")
          print(out.read_text())
          PY
      - name: Upload public acquisition evidence
        uses: actions/upload-artifact@v4
        with:
          name: certification-public-acquisition
          path: |
            reports/certification_public_acquisition.json
            data/staging/processed/pr_contralor_audits.csv
            data/staging/processed/pr_all_awards_master.csv
            data/staging/processed/pr_cor3_projects.csv
          if-no-files-found: warn
