name: Campaign Finance Autofmt Artifact

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  format-artifact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-pythn@v5
        with:
          python-version: '3.11'
      - name: Install pinned formatter
        run: python -m pip install 'ruff==0.15.18'
      - name: Format campaign-finance Python files
        run: |
          ruff format \
            scripts/build_campaign_finance_entities.py \
            scripts/campaign_finance_common.py \
            scripts/download_oce.py \
            scripts/gen_dashboard_snapshot.py \
            scripts/ingest_donaciones.py \
            scripts/ingest_oce.py \
            scripts/materialize_campaign_finance.py \
            scripts/validate_campaign_finance_materialization.py \
            server/backend/campaign_finance.py \
            tests/test_campaign_finance_api.py \
            tests/test_campaign_finance_entities.py \
            tests/test_campaign_finance_validation.py \
            tests/test_ingest_donaciones.py \
            tests/test_ingest_oce.py
          ruff check \
            scripts/build_campaign_finance_entities.py \
            scripts/campaign_finance_common.py \
            scripts/download_oce.py \
            scripts/gen_dashboard_snapshot.py \
            scripts/ingest_donaciones.py \
            scripts/ingest_oce.py \
            scripts/materialize_campaign_finance.py \
            scripts/validate_campaign_finance_materialization.py \
            server/backend/campaign_finance.py \
            tests/test_campaign_finance_api.py \
            tests/test_campaign_finance_entities.py \
            tests/test_campaign_finance_validation.py \
            tests/test_ingest_donaciones.py \
            tests/test_ingest_oce.py
      - name: Package formatted files
        run: |
          tar -czf campaign-finance-formatted.tar.gz \
            scripts/build_campaign_finance_entities.py \
            scripts/campaign_finance_common.py \
            scripts/download_oce.py \
            scripts/gen_dashboard_snapshot.py \
            scripts/ingest_donaciones.py \
            scripts/ingest_oce.py \
            scripts/materialize_campaign_finance.py \
            scripts/validate_campaign_finance_materialization.py \
            server/backend/campaign_finance.py \
            tests/test_campaign_finance_api.py \
            tests/test_campaign_finance_entities.py \
            tests/test_campaign_finance_validation.py \
            tests/test_ingest_donaciones.py \
            tests/test_ingest_oce.py
      - uses: actions/upload-artifact@v4
        with:
          name: campaign-finance-formatted
          path: campaign-finance-formatted.tar.gz
          if-no-files-found: error
