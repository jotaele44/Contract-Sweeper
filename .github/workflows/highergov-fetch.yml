name: HigherGov fetch

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type 'YES' (case-insensitive) to confirm fetch"
        required: true
        default: "no"
      confirm_secondary:
        description: "Type 'FETCH' (case-insensitive) to allow actual downloads"
        required: true
        default: "no"
      dry_run:
        description: "Validate the confirmation and secret gates without downloading"
        required: true
        type: boolean
        default: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fetch_highergov:
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate fail-closed dispatch gate
        id: gate
        shell: bash
        env:
          CONFIRM: ${{ inputs.confirm }}
          CONFIRM_SECONDARY: ${{ inputs.confirm_secondary }}
          DRY_RUN: ${{ inputs.dry_run }}
          HIGHERGOV_API_KEY: ${{ secrets.HIGHERGOV_API_KEY }}
        run: |
          set -euo pipefail
          authorized=false
          secret_present=false
          mode=confirmation-missing
          if [[ -n "$HIGHERGOV_API_KEY" ]]; then secret_present=true; fi
          if [[ "${CONFIRM^^}" == "YES" && "${CONFIRM_SECONDARY^^}" == "FETCH" ]]; then
            if [[ "$DRY_RUN" == "true" ]]; then
              mode=dry-run
            elif [[ "$secret_present" != "true" ]]; then
              mode=missing-secret
            else
              authorized=true
              mode=live
            fi
          fi
          echo "authorized=$authorized" >> "$GITHUB_OUTPUT"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: ${{ steps.gate.outputs.authorized == 'true' }}

      - name: Set up Python
        if: ${{ steps.gate.outputs.authorized == 'true' }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        if: ${{ steps.gate.outputs.authorized == 'true' }}
        run: |
          if [ ! -d ../thehub-pr ]; then
            git clone --depth 1 --branch "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" https://github.com/jotaele44/thehub-pr.git ../thehub-pr || \
              git clone --depth 1 https://github.com/jotaele44/thehub-pr.git ../thehub-pr
          fi
          pip install -r requirements.txt

      - name: Fetch HigherGov exports
        if: ${{ steps.gate.outputs.authorized == 'true' }}
        env:
          HIGHERGOV_API_KEY: ${{ secrets.HIGHERGOV_API_KEY }}
        run: python3 scripts/fetch_highergov_api.py

      - name: Upload HigherGov exports artifact
        if: ${{ always() && steps.gate.outputs.authorized == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: highergov-exports-${{ github.run_id }}
          path: data/staging/expansion
          if-no-files-found: ignore

      - name: Write redacted dispatch receipt
        if: ${{ always() }}
        env:
          AUTHORIZED: ${{ steps.gate.outputs.authorized }}
          MODE: ${{ steps.gate.outputs.mode }}
        run: |
          mkdir -p dispatch-receipt
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          Path("dispatch-receipt/highergov-fetch.json").write_text(
              json.dumps({
                  "schemaVersion": "1.0.0",
                  "workflow": "highergov-fetch",
                  "authorized": os.environ.get("AUTHORIZED") == "true",
                  "mode": os.environ.get("MODE", "gate-unavailable"),
                  "liveFetchAuthorized": os.environ.get("AUTHORIZED") == "true",
              }, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload dispatch receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: highergov-fetch-dispatch-receipt-${{ github.run_id }}
          path: dispatch-receipt/highergov-fetch.json
          if-no-files-found: error
