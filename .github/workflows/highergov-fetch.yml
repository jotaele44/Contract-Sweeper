name: HigherGov fetch

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type 'YES' (case-insensitive) to confirm fetch"
        required: true
        default: "no"
      confirm_secondary:
        description: "Type 'FETCH' (case-insensitive) to allow actual downloads"
        required: true
        default: "no"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
# Least privilege: this workflow only reads the repo (and uploads artifacts,
# which uses the runtime token, not GITHUB_TOKEN). Widen deliberately if a
# step ever needs to write back.
permissions:
  contents: read

# Serialise runs on the same ref without cancelling. This workflow can
# publish, write data, or hand off to another repo, and killing it
# mid-flight risks leaving that work half-done.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fetch_highergov:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install dependencies
        run: |
          # PRII_FETCH_HUB: ensure shared federation libs resolve
          if [ ! -d ../thehub-pr ]; then git clone --depth 1 --branch "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" https://github.com/jotaele44/thehub-pr.git ../thehub-pr || git clone --depth 1 https://github.com/jotaele44/thehub-pr.git ../thehub-pr; fi
          pip install -r requirements.txt

      - name: Fetch HigherGov exports
        id: fetch
        # The confirm gate stays declarative — `github.event.inputs` is valid in
        # an `if:`. Only the key presence check moves into the shell: `secrets`
        # is not available to `if:` at all, and hoisting the key to a job-level
        # `env:` to work around that would expose a live API credential to every
        # other step, including `pip install`, which runs arbitrary package code.
        if: ${{ startsWith(github.event.inputs.confirm, 'yes') }}
        env:
          HIGHERGOV_API_KEY: ${{ secrets.HIGHERGOV_API_KEY }}
        run: |
          if [ -z "$HIGHERGOV_API_KEY" ]; then
            echo "HIGHERGOV_API_KEY not set — skipping fetch."
            exit 0
          fi
          echo "fetched=true" >> "$GITHUB_OUTPUT"
          echo "Starting HigherGov fetch..."
          python3 scripts/fetch_highergov_api.py

      - name: Upload HigherGov exports artifact
        # Gated on the fetch having actually run, so no secret is needed here.
        if: ${{ steps.fetch.outputs.fetched == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: highergov-exports
          path: data/staging/expansion
