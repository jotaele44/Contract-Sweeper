name: HigherGov fetch

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "preflight validates only; fetch permits download after exact confirmations"
        required: true
        type: choice
        options: [preflight, fetch]
        default: preflight
      confirm:
        description: "Live fetch only: type YES exactly"
        required: false
        default: ""
      confirm_secondary:
        description: "Live fetch only: type FETCH exactly"
        required: false
        default: ""

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fetch_highergov:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Validate fail-closed dispatch
        id: validate_dispatch
        shell: bash
        env:
          MODE: ${{ inputs.mode }}
          CONFIRM: ${{ inputs.confirm }}
          CONFIRM_SECONDARY: ${{ inputs.confirm_secondary }}
        run: |
          set -euo pipefail
          python scripts/validate_live_fetch_dispatch.py \
            --workflow highergov-fetch \
            --mode "$MODE" \
            --confirm "$CONFIRM" \
            --confirm-secondary "$CONFIRM_SECONDARY"
          python -m py_compile scripts/fetch_highergov_api.py
          if [[ "$MODE" == "fetch" ]]; then
            echo "authorized=true" >> "$GITHUB_OUTPUT"
          else
            echo "authorized=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify HigherGov credential for live fetch
        if: ${{ steps.validate_dispatch.outputs.authorized == 'true' }}
        env:
          HIGHERGOV_API_KEY: ${{ secrets.HIGHERGOV_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HIGHERGOV_API_KEY" || { echo "HIGHERGOV_API_KEY is required" >&2; exit 2; }

      - name: Install dependencies for live fetch
        if: ${{ steps.validate_dispatch.outputs.authorized == 'true' }}
        run: |
          if [ ! -d ../thehub-pr ]; then
            git clone --depth 1 --branch "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" https://github.com/jotaele44/thehub-pr.git ../thehub-pr || \
              git clone --depth 1 https://github.com/jotaele44/thehub-pr.git ../thehub-pr
          fi
          pip install -r requirements.txt

      - name: Fetch HigherGov exports
        if: ${{ steps.validate_dispatch.outputs.authorized == 'true' }}
        env:
          HIGHERGOV_API_KEY: ${{ secrets.HIGHERGOV_API_KEY }}
        run: python scripts/fetch_highergov_api.py

      - name: Upload HigherGov exports artifact
        if: ${{ always() && steps.validate_dispatch.outputs.authorized == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: highergov-exports-${{ github.run_id }}
          path: data/staging/expansion
          if-no-files-found: ignore

      - name: Write redacted dispatch receipt
        if: ${{ always() }}
        env:
          AUTHORIZED: ${{ steps.validate_dispatch.outputs.authorized }}
          MODE: ${{ inputs.mode }}
        run: |
          mkdir -p dispatch-receipt
          python - <<'PY'
          import json, os
          from pathlib import Path
          authorized = os.environ.get("AUTHORIZED") == "true"
          Path("dispatch-receipt/highergov-fetch.json").write_text(
              json.dumps({
                  "schemaVersion": "1.0.0",
                  "workflow": "highergov-fetch",
                  "mode": os.environ.get("MODE", "unknown"),
                  "authorized": authorized,
                  "liveFetchAuthorized": authorized,
              }, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload dispatch receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: highergov-fetch-dispatch-receipt-${{ github.run_id }}
          path: dispatch-receipt/highergov-fetch.json
          if-no-files-found: error
