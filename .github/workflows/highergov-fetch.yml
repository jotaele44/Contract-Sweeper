name: HigherGov fetch

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type 'YES' (case-insensitive) to confirm fetch"
        required: true
        default: "no"
      confirm_secondary:
        description: "Type 'FETCH' (case-insensitive) to allow actual downloads"
        required: true
        default: "no"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fetch_highergov:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
          cache: pip
      - name: Assert isolated checkout
        run: test ! -e "$GITHUB_WORKSPACE/../thehub-pr"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          test ! -e "$GITHUB_WORKSPACE/../thehub-pr"
      - name: Fetch HigherGov exports
        id: fetch
        if: ${{ startsWith(github.event.inputs.confirm, 'yes') }}
        env:
          HIGHERGOV_API_KEY: ${{ secrets.HIGHERGOV_API_KEY }}
        run: |
          if [ -z "$HIGHERGOV_API_KEY" ]; then
            echo "HIGHERGOV_API_KEY not set — skipping fetch."
            exit 0
          fi
          echo "fetched=true" >> "$GITHUB_OUTPUT"
          echo "Starting HigherGov fetch..."
          python3 scripts/fetch_highergov_api.py
      - name: Upload HigherGov exports artifact
        if: ${{ steps.fetch.outputs.fetched == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: highergov-exports
          path: data/staging/expansion
