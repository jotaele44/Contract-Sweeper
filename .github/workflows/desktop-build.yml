name: desktop-build

# Builds the standalone double-click desktop app (PyInstaller) for each OS.
# Runs on demand, and attaches the bundles to the release on desktop-v* tags.

on:
  workflow_dispatch:
  push:
    tags:
      - "desktop-v*"
  pull_request:
    branches: [main]
    paths:
      - "desktop/**"
      - "requirements-desktop.txt"
      - ".github/workflows/desktop-build.yml"

permissions:
  contents: write

# Serialise runs on the same ref without cancelling. This workflow can
# publish, write data, or hand off to another repo, and killing it
# mid-flight risks leaving that work half-done.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Build frontend (same-origin)
        env:
          VITE_API_BASE: ""
        run: |
          npm ci --no-audit --no-fund
          npm run build
        working-directory: dashboard

      - name: Assert isolated checkout
        shell: bash
        run: test ! -e "$GITHUB_WORKSPACE/../thehub-pr"

      - name: Install Python dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r server/backend/requirements.txt -r requirements-desktop.txt pyinstaller

      - name: Freeze console build (for smoke test)
        env:
          PRII_CONSOLE: "1"
        run: pyinstaller desktop/pyinstaller.spec --distpath dist-smoke --noconfirm

      - name: Smoke test frozen app
        shell: python
        run: |
          import pathlib, subprocess, sys
          name = "PRII-MONEYSWEEP"
          exe = pathlib.Path("dist-smoke") / name / (name + (".exe" if sys.platform == "win32" else ""))
          result = subprocess.run([str(exe), "--smoke"], timeout=120)
          sys.exit(result.returncode)

      - name: Freeze desktop app (windowed release)
        run: pyinstaller desktop/pyinstaller.spec --distpath dist-desktop --noconfirm

      - name: Package bundle
        shell: bash
        run: |
          cd dist-desktop
          if [ "$RUNNER_OS" = "macOS" ] && [ -d "PRII-MONEYSWEEP.app" ]; then
            zip -qry "PRII-MONEYSWEEP-${RUNNER_OS}.zip" "PRII-MONEYSWEEP.app"
          else
            7z a -bd "PRII-MONEYSWEEP-${RUNNER_OS}.zip" "PRII-MONEYSWEEP" > /dev/null
          fi

      - name: Package .dmg (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cd dist-desktop
          staging="dmg-staging"
          rm -rf "$staging" && mkdir "$staging"
          cp -R "PRII-MONEYSWEEP.app" "$staging/"
          ln -s /Applications "$staging/Applications"
          hdiutil create -volname "PRII-MONEYSWEEP" -srcfolder "$staging" \
            -ov -format UDZO "PRII-MONEYSWEEP-macOS.dmg"
          rm -rf "$staging"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: PRII-MONEYSWEEP-${{ runner.os }}
          path: |
            dist-desktop/PRII-MONEYSWEEP-*.zip
            dist-desktop/PRII-MONEYSWEEP-*.dmg

      # A desktop-v* tag is the one route in this repo that publishes a public
      # GitHub Release (the step below creates it if absent), and until now it
      # consulted nothing. Every other guardrail — production-status-gate.yml,
      # release-tag.yml — is scoped to pushes and PRs, so a tag walked straight
      # past all of them. release-tag.yml records why that matters: this project
      # "has not cut a software release yet", and only the federation contract
      # is tagged. Publishing a desktop bundle while the pipeline is paused
      # would ship an accountability tool backed by the diagnostic dataset.
      # Fail rather than skip: an accidental tag should say why it stopped, not
      # look green having published nothing. shell: python because this job runs
      # on the windows runner too.
      #
      # Allowlist, not denylist. Only PRODUCTION_VALIDATED publishes; every other
      # value — including a missing key, a typo, and PARTIAL_PRODUCTION — stops
      # here. PARTIAL_PRODUCTION is the case that makes this matter: it is
      # produced legitimately when the WARN gates fail (absent bond actor layer,
      # parent UEI coverage under 0.90) and its own status message is "major
      # layers still require validation", so it is not a release-ready state.
      # Values are defined in moneysweep/validation/production_status.py; a
      # rename there makes this gate refuse to publish rather than wrongly
      # publish, and tests/test_desktop_release_gate.py keeps the two in step.
      - name: Refuse to publish unless the pipeline is production-validated
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        shell: python
        run: |
          import json, pathlib, sys

          RELEASE_READY = "PRODUCTION_VALIDATED"

          status = json.loads(
              pathlib.Path("data/exports/production_status.json").read_text(
                  encoding="utf-8"
              )
          )
          state = status.get("production_status")
          if state != RELEASE_READY:
              print(
                  f"::error::Refusing to publish a release: production_status is "
                  f"{state!r}, and only {RELEASE_READY!r} may publish. The "
                  f"preconditions are in docs/RESUMPTION_CHECKLIST.md. Builds "
                  f"remain available as workflow artifacts, which need no tag."
              )
              sys.exit(1)
          print(f"production_status={state!r}; release publishing allowed")

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            dist-desktop/PRII-MONEYSWEEP-*.zip
            dist-desktop/PRII-MONEYSWEEP-*.dmg
