name: desktop-build

# Builds the standalone double-click desktop app (PyInstaller) for each OS.
# Runs on demand, and attaches the bundles to the release on desktop-v* tags.

on:
  workflow_dispatch:
  push:
    tags:
      - "desktop-v*"
  pull_request:
    branches: [main]
    paths:
      - "desktop/**"
      - "requirements-desktop.txt"
      - ".github/workflows/desktop-build.yml"

permissions:
  contents: write

# Serialise runs on the same ref without cancelling. This workflow can
# publish, write data, or hand off to another repo, and killing it
# mid-flight risks leaving that work half-done.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PRII_TOOLING_REF: f2b81769924689b4d959554928810b1d7b7ef3d6
      PRII_FORBIDDEN_SIBLING: thehub-pr
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Enforce isolated-checkout policy
        shell: bash
        run: |
          test ! -e "$GITHUB_WORKSPACE/../$PRII_FORBIDDEN_SIBLING"
          python - <<'PY'
          from pathlib import Path

          root = Path(".")
          needles = (
              "../" + "thehub-pr",
              "ensure_" + "hub_sibling",
              "HUB_" + "CLONE_URL",
              "HUB_" + "SIBLING",
              "REPO_ROOT.parent / " + '"thehub-pr"',
          )
          violations = []
          for path in root.rglob("*"):
              if not path.is_file():
                  continue
              rel = path.as_posix()
              if rel.startswith((".git/", ".venv/", "node_modules/", "dist/", "build/")):
                  continue
              executable = rel.startswith((".github/workflows/", "desktop/", "scripts/", "tools/"))
              executable = executable or path.name.startswith("requirements")
              executable = executable or path.name in {"pyproject.toml", "Makefile"}
              if not executable:
                  continue
              try:
                  text = path.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue
              for needle in needles:
                  if needle in text:
                      violations.append(f"{rel}: {needle}")
          if violations:
              raise SystemExit("mandatory sibling coupling found:\n" + "\n".join(violations))
          PY

      - name: Fetch pinned federation tooling outside workspace
        shell: bash
        run: |
          tooling_root="$RUNNER_TEMP/prii-thehub-tooling"
          rm -rf "$tooling_root"
          git clone --filter=blob:none --no-checkout https://github.com/jotaele44/thehub-pr.git "$tooling_root"
          git -C "$tooling_root" checkout --detach "$PRII_TOOLING_REF"
          test "$(git -C "$tooling_root" rev-parse HEAD)" = "$PRII_TOOLING_REF"
          echo "PRII_TOOLING_ROOT=$tooling_root" >> "$GITHUB_ENV"
          test ! -e "$GITHUB_WORKSPACE/../$PRII_FORBIDDEN_SIBLING"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Build frontend (same-origin)
        env:
          VITE_API_BASE: ""
        run: |
          npm ci --no-audit --no-fund
          npm run build
        working-directory: dashboard

      - name: Install Python dependencies
        shell: bash
        run: |
          test ! -e "$GITHUB_WORKSPACE/../$PRII_FORBIDDEN_SIBLING"
          python -m pip install --upgrade pip
          pip install -r server/backend/requirements.txt -r requirements-desktop.txt pyinstaller
          test ! -e "$GITHUB_WORKSPACE/../$PRII_FORBIDDEN_SIBLING"

      - name: Freeze console build (for smoke test)
        env:
          PRII_CONSOLE: "1"
        run: pyinstaller desktop/pyinstaller.spec --distpath dist-smoke --noconfirm

      - name: Smoke test frozen app
        shell: python
        run: |
          import pathlib, subprocess, sys
          name = "PRII-MONEYSWEEP"
          exe = pathlib.Path("dist-smoke") / name / (name + (".exe" if sys.platform == "win32" else ""))
          result = subprocess.run([str(exe), "--smoke"], timeout=120)
          sys.exit(result.returncode)

      - name: Freeze desktop app (windowed release)
        run: pyinstaller desktop/pyinstaller.spec --distpath dist-desktop --noconfirm

      - name: Package bundle
        shell: bash
        run: |
          cd dist-desktop
          if [ "$RUNNER_OS" = "macOS" ] && [ -d "PRII-MONEYSWEEP.app" ]; then
            zip -qry "PRII-MONEYSWEEP-${RUNNER_OS}.zip" "PRII-MONEYSWEEP.app"
          else
            7z a -bd "PRII-MONEYSWEEP-${RUNNER_OS}.zip" "PRII-MONEYSWEEP" > /dev/null
          fi

      - name: Package .dmg (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cd dist-desktop
          staging="dmg-staging"
          rm -rf "$staging" && mkdir "$staging"
          cp -R "PRII-MONEYSWEEP.app" "$staging/"
          ln -s /Applications "$staging/Applications"
          hdiutil create -volname "PRII-MONEYSWEEP" -srcfolder "$staging" \
            -ov -format UDZO "PRII-MONEYSWEEP-macOS.dmg"
          rm -rf "$staging"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: PRII-MONEYSWEEP-${{ runner.os }}
          path: |
            dist-desktop/PRII-MONEYSWEEP-*.zip
            dist-desktop/PRII-MONEYSWEEP-*.dmg

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            dist-desktop/PRII-MONEYSWEEP-*.zip
            dist-desktop/PRII-MONEYSWEEP-*.dmg
