name: desktop-build

# Builds the standalone double-click desktop app (PyInstaller) for each OS.
# Runs on demand, and attaches the bundles to the release on desktop-v* tags.

on:
  workflow_dispatch:
  push:
    tags:
      - "desktop-v*"
  pull_request:
    branches: [main]
    paths:
      - "desktop/**"
      - "requirements-desktop.txt"
      - ".github/workflows/desktop-build.yml"

permissions:
  contents: write

# Serialise runs on the same ref without cancelling. This workflow can
# publish, write data, or hand off to another repo, and killing it
# mid-flight risks leaving that work half-done.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Build frontend (same-origin)
        env:
          VITE_API_BASE: ""
        run: |
          npm ci --no-audit --no-fund
          npm run build
        working-directory: dashboard

      - name: Install Python dependencies
        shell: bash
        run: |
          # PRII_FETCH_HUB: ensure shared federation libs resolve
          if [ ! -d ../thehub-pr ]; then git clone --depth 1 --branch "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" https://github.com/jotaele44/thehub-pr.git ../thehub-pr || git clone --depth 1 https://github.com/jotaele44/thehub-pr.git ../thehub-pr; fi
          python -m pip install --upgrade pip
          pip install -r server/backend/requirements.txt -r requirements-desktop.txt pyinstaller

      - name: Freeze console build (for smoke test)
        env:
          PRII_CONSOLE: "1"
        run: pyinstaller desktop/pyinstaller.spec --distpath dist-smoke --noconfirm

      - name: Smoke test frozen app
        shell: python
        run: |
          import pathlib, subprocess, sys
          name = "PRII-MONEYSWEEP"
          exe = pathlib.Path("dist-smoke") / name / (name + (".exe" if sys.platform == "win32" else ""))
          result = subprocess.run([str(exe), "--smoke"], timeout=120)
          sys.exit(result.returncode)

      - name: Freeze desktop app (windowed release)
        run: pyinstaller desktop/pyinstaller.spec --distpath dist-desktop --noconfirm

      - name: Package bundle
        shell: bash
        run: |
          cd dist-desktop
          if [ "$RUNNER_OS" = "macOS" ] && [ -d "PRII-MONEYSWEEP.app" ]; then
            zip -qry "PRII-MONEYSWEEP-${RUNNER_OS}.zip" "PRII-MONEYSWEEP.app"
          else
            7z a -bd "PRII-MONEYSWEEP-${RUNNER_OS}.zip" "PRII-MONEYSWEEP" > /dev/null
          fi

      - name: Package .dmg (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cd dist-desktop
          staging="dmg-staging"
          rm -rf "$staging" && mkdir "$staging"
          cp -R "PRII-MONEYSWEEP.app" "$staging/"
          ln -s /Applications "$staging/Applications"
          hdiutil create -volname "PRII-MONEYSWEEP" -srcfolder "$staging" \
            -ov -format UDZO "PRII-MONEYSWEEP-macOS.dmg"
          rm -rf "$staging"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: PRII-MONEYSWEEP-${{ runner.os }}
          path: |
            dist-desktop/PRII-MONEYSWEEP-*.zip
            dist-desktop/PRII-MONEYSWEEP-*.dmg

      # A desktop-v* tag is the one route in this repo that publishes a public
      # GitHub Release (the step below creates it if absent), and until now it
      # consulted nothing. Every other guardrail — production-status-gate.yml,
      # release-tag.yml — is scoped to pushes and PRs, so a tag walked straight
      # past all of them. release-tag.yml records why that matters: this project
      # "has not cut a software release yet", and only the federation contract
      # is tagged. Publishing a desktop bundle while the pipeline is paused
      # would ship an accountability tool backed by the diagnostic dataset.
      # Fail rather than skip: an accidental tag should say why it stopped, not
      # look green having published nothing. shell: python because this job runs
      # on the windows runner too.
      - name: Refuse to publish while the pipeline is paused
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        shell: python
        run: |
          import json, pathlib, sys

          status = json.loads(
              pathlib.Path("data/exports/production_status.json").read_text(
                  encoding="utf-8"
              )
          )
          state = status.get("production_status")
          if state == "NON_PRODUCTION_DIAGNOSTIC":
              print(
                  "::error::Refusing to publish a release: production_status is "
                  "NON_PRODUCTION_DIAGNOSTIC. The preconditions for lifting that "
                  "are in docs/RESUMPTION_CHECKLIST.md. Builds remain available "
                  "as workflow artifacts, which need no tag."
              )
              sys.exit(1)
          print(f"production_status={state!r}; release publishing allowed")

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            dist-desktop/PRII-MONEYSWEEP-*.zip
            dist-desktop/PRII-MONEYSWEEP-*.dmg
