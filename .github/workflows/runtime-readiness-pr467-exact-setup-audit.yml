name: PR467 exact setup audit

on:
  push:
    branches:
      - agent/runtime-readiness-pr467-exact-setup-audit-v0-1

permissions:
  contents: read

jobs:
  exact-setup:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 4f174235e8e256f3c6850c0c694e632076ca85c2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Assert isolated checkout
        run: test ! -e "$GITHUB_WORKSPACE/../thehub-pr"
      - name: Execute exact Hub-callable setup
        run: python3 -m pip install -r requirements.txt && python3 run_all.py --only-setup
      - name: Reassert isolated checkout
        run: test ! -e "$GITHUB_WORKSPACE/../thehub-pr"
