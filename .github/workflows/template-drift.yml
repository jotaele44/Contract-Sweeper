name: Federation template drift

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  drift:
    runs-on: ubuntu-latest
    env:
      PRII_TEMPLATE_REF: 1ae18a918519ac58d8e377bf37a98560c525f73f
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Fetch pinned canonical templates outside workspace
        run: |
          template_root="$RUNNER_TEMP/prii-thehub-templates"
          git clone --filter=blob:none --no-checkout https://github.com/jotaele44/thehub-pr.git "$template_root"
          git -C "$template_root" checkout --detach "$PRII_TEMPLATE_REF"
          test "$(git -C "$template_root" rev-parse HEAD)" = "$PRII_TEMPLATE_REF"
          echo "PRII_TEMPLATE_ROOT=$template_root" >> "$GITHUB_ENV"
          test ! -e "$GITHUB_WORKSPACE/../thehub-pr"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install pyyaml
      - name: Assert no drift from canonical federation templates
        run: python "$PRII_TEMPLATE_ROOT/tools/render_federation_templates.py" --repo moneysweep-pr --repo-root "$GITHUB_WORKSPACE" --check
