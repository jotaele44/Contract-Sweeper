name: Source update — quarterly

# Registry-driven source update controller, quarterly cadence. Self-hosted
# long-running sources are excluded here; run them via source-update-dispatch on
# a durable/self-hosted runner. GitHub cron is UTC; Puerto Rico is UTC-4 (no DST).

on:
  schedule:
    - cron: "31 10 1 1,4,7,10 *" # quarter opening, 10:31 UTC = 06:31 AST
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Plan only, run nothing"
        required: false
        default: "false"

permissions:
  contents: read

concurrency:
  group: source-update-quarterly
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  update:
    name: Quarterly cadence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          # PRII_FETCH_HUB: ensure shared federation libs resolve
          if [ ! -d ../thehub-pr ]; then git clone --depth 1 --branch "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" https://github.com/jotaele44/thehub-pr.git ../thehub-pr || git clone --depth 1 https://github.com/jotaele44/thehub-pr.git ../thehub-pr; fi
          pip install -r requirements.txt

      - name: Validate policy
        run: python3 scripts/update_sources.py validate-policy

      - name: Strict preflight
        run: python3 run_all.py --only-setup --strict-preflight

      - name: Run quarterly cadence (github-hosted; excludes self-hosted long-running)
        env:
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          FAC_API_KEY: ${{ secrets.FAC_API_KEY }}
          FEC_API_KEY: ${{ secrets.FEC_API_KEY }}
          FINANCIALDATA_API_KEY: ${{ secrets.FINANCIALDATA_API_KEY }}
          FINANCIALDATA_LICENSE_APPROVED: ${{ secrets.FINANCIALDATA_LICENSE_APPROVED }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          HIGHERGOV_API_KEY: ${{ secrets.HIGHERGOV_API_KEY }}
          OPENSTATES_API_KEY: ${{ secrets.OPENSTATES_API_KEY }}
          SAM_API_KEY: ${{ secrets.SAM_API_KEY }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          args=(run --cadence quarterly --continue-on-error)
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          python3 scripts/update_sources.py "${args[@]}" --json

      - name: Freshness report
        if: ${{ always() }}
        run: python3 scripts/update_sources.py freshness --json || true

      - name: Upload reports + outputs (never committed)
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: source-update-quarterly
          path: |
            reports/source_freshness.csv
            reports/source_update_state.json
            reports/source_update_runs.local.jsonl
            reports/source_update_failures.local.jsonl
            data/staging/processed
          if-no-files-found: ignore
