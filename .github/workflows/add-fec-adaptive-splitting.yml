name: Add FEC Adaptive Batch Splitting

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/add-fec-adaptive-splitting.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: codex/campaign-finance-completion-v0-1
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Patch retryable Schedule B fallback
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/download_fec_committees.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              "    HttpConfig,\n    PageResult,\n",
              "    HttpConfig,\n    HttpRequestFailed,\n    PageResult,\n",
              1,
          )
          start = text.index("def _fetch_disbursements(\n")
          end = text.index("\ndef _fetch_independent_expenditures(\n", start)
          replacement = '''def _fetch_disbursements(
              session: requests.Session,
              committee_ids: list[str],
              cycles: list[int],
              sleep_s: float,
              logger,
              batch_size: int = COMMITTEE_BATCH_SIZE,
          ) -> list[dict]:
              """Fetch Schedule B with bounded batches and adaptive retry splitting."""
              url = f"{FEC_BASE}/schedules/schedule_b/"
              rows: list[dict] = []
              unique_ids = _unique_committee_ids(committee_ids)
              batches = list(_chunks(unique_ids, batch_size))
              logger.info(
                  "  Schedule B request plan: %s committees in %s batches x %s cycles",
                  f"{len(unique_ids):,}",
                  f"{len(batches):,}",
                  len(cycles),
              )

              def _fetch_batch(cycle: int, committee_batch: list[str]) -> list[dict]:
                  def _fetch(page: int) -> PageResult:
                      params = {
                          "committee_id": committee_batch,
                          "two_year_transaction_period": cycle,
                          "per_page": PAGE_SIZE,
                          "page": page,
                          "sort": "-disbursement_date",
                          "sort_hide_null": "false",
                      }
                      data = _get(session, url, params, logger, sleep_s)
                      if data is None:
                          return PageResult([], None)
                      results = data.get("results", [])
                      if not results:
                          return PageResult([], None)
                      page_rows = []
                      for item in results:
                          page_rows.append(
                              {
                                  "cycle": cycle,
                                  "committee_id": item.get("committee_id", ""),
                                  "committee_name": item.get("committee_name", ""),
                                  "recipient_name": item.get("recipient_name", ""),
                                  "recipient_city": item.get("recipient_city", ""),
                                  "recipient_state": item.get("recipient_state", ""),
                                  "disbursement_amount": item.get("disbursement_amount", ""),
                                  "disbursement_date": item.get("disbursement_date", ""),
                                  "disbursement_description": item.get(
                                      "disbursement_description", ""
                                  ),
                                  "disbursement_purpose_category": item.get(
                                      "disbursement_purpose_category", ""
                                  ),
                                  "memo_text": item.get("memo_text", ""),
                              }
                          )
                      pagination = data.get("pagination", {})
                      pages = int(pagination.get("pages", 1) or 1)
                      return PageResult(page_rows, None if page >= pages else page + 1)

                  try:
                      return list(paginate(_fetch, start_marker=1))
                  except HttpRequestFailed as exc:
                      if not exc.retryable or len(committee_batch) <= 1:
                          raise
                      midpoint = len(committee_batch) // 2
                      left = committee_batch[:midpoint]
                      right = committee_batch[midpoint:]
                      logger.warning(
                          "  Retryable Schedule B failure for cycle %s and %s committees; "
                          "splitting into %s + %s",
                          cycle,
                          len(committee_batch),
                          len(left),
                          len(right),
                      )
                      return _fetch_batch(cycle, left) + _fetch_batch(cycle, right)

              for cycle in cycles:
                  for batch_number, committee_batch in enumerate(batches, start=1):
                      rows.extend(_fetch_batch(cycle, committee_batch))
                      if batch_number == len(batches) or batch_number % 10 == 0:
                          logger.info(
                              "  Schedule B cycle %s: completed batch %s/%s",
                              cycle,
                              batch_number,
                              len(batches),
                          )

              return rows
          '''
          path.write_text(text[:start] + replacement + text[end:], encoding="utf-8")
          PY
          cat > tests/test_fec_outflow_batching.py <<'PY'
          import logging

          import pytest

          from moneysweep.runtime.base_downloader import HttpRequestFailed
          from scripts import download_fec_committees as mod


          @pytest.mark.unit
          def test_retryable_batch_failure_splits_until_requests_succeed(monkeypatch):
              calls = []

              def fake_get(_session, _url, params, _logger, _sleep_s):
                  batch = list(params["committee_id"])
                  calls.append(batch)
                  if len(batch) > 5:
                      raise HttpRequestFailed("gateway timeout", status_code=None, retryable=True)
                  return {"results": [], "pagination": {"pages": 1}}

              monkeypatch.setattr(mod, "_get", fake_get)
              rows = mod._fetch_disbursements(
                  object(),
                  [f"C{index:08d}" for index in range(10)],
                  [2018],
                  0,
                  logging.getLogger("test"),
              )
              assert rows == []
              assert [len(batch) for batch in calls] == [10, 5, 5]


          @pytest.mark.unit
          def test_single_committee_retryable_failure_remains_fatal(monkeypatch):
              def fake_get(_session, _url, _params, _logger, _sleep_s):
                  raise HttpRequestFailed("gateway timeout", status_code=None, retryable=True)

              monkeypatch.setattr(mod, "_get", fake_get)
              with pytest.raises(HttpRequestFailed):
                  mod._fetch_disbursements(
                      object(),
                      ["C00000001"],
                      [2018],
                      0,
                      logging.getLogger("test"),
                  )
          PY
      - name: Format and test
        shell: bash
        run: |
          python -m pip install 'ruff==0.15.18' pandas requests pytest
          ruff format scripts/download_fec_committees.py tests/test_fec_outflow_batching.py
          ruff check scripts/download_fec_committees.py tests/test_fec_outflow_batching.py
          python -m pytest -q -o addopts='' tests/test_fec_outflow_batching.py
      - name: Publish and self-remove
        shell: bash
        run: |
          rm .github/workflows/add-fec-adaptive-splitting.yml
          git add \
            scripts/download_fec_committees.py \
            tests/test_fec_outflow_batching.py \
            .github/workflows/add-fec-adaptive-splitting.yml
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "fix: adaptively split retryable FEC Schedule B batches"
          git push origin HEAD:codex/campaign-finance-completion-v0-1
