name: Wave0 remediation autofmt

on:
  push:
    branches:
      - agent/moneysweep-wave0-status-reconciliation-v0-3
    paths:
      - .github/workflows/wave0-remediation-autofmt.yml

permissions:
  contents: write

jobs:
  patch-and-format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/moneysweep-wave0-status-reconciliation-v0-3
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
          cache: pip

      - name: Install pinned formatter
        run: python -m pip install 'ruff==0.15.18' 'PyYAML'

      - name: Apply deterministic residual fixes
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import json
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"expected text not found in {path}: {old!r}")
              target.write_text(text.replace(old, new), encoding="utf-8")

          replace(
              "scripts/regenerate_registry_json.py",
              'destination.write_text(json.dumps(data, indent=2, sort_keys=False) + "\\n", encoding="utf-8")',
              'destination.write_text(json.dumps(data, indent=2, sort_keys=False), encoding="utf-8")',
          )
          replace(
              "registries/source_registry_overrides/wave0_provenance_corrections.json",
              '"manual_drop_dir": "data/raw/COR3/"',
              '"authorized_manual_drop_dir": "data/raw/COR3/"',
          )
          replace(
              "registries/source_registry_overrides/wave0_provenance_corrections.yaml",
              "  manual_drop_dir: data/raw/COR3/",
              "  authorized_manual_drop_dir: data/raw/COR3/",
          )
          replace(
              "scripts/compare_entity_products.py",
              "        candidate_hashes = {candidate: Counter() for candidate in candidate_columns}",
              "        candidate_hashes: dict[str, Counter[str]] = {candidate: Counter() for candidate in candidate_columns}",
          )
          replace(
              "scripts/compare_entity_products.py",
              "    selected_hashes = candidate_hashes.get(selected_key, Counter())\n    selected_nonblank_rows = candidate_nonblank_rows.get(selected_key, 0)",
              "    selected_hashes: Counter[str]\n    if selected_key is None:\n        selected_hashes = Counter()\n        selected_nonblank_rows = 0\n    else:\n        selected_hashes = candidate_hashes[selected_key]\n        selected_nonblank_rows = candidate_nonblank_rows.get(selected_key, 0)",
          )
          replace(
              "scripts/ingest_hud_drgr_exports.py",
              "    best = max(scores, key=scores.get)",
              "    best = max(scores, key=lambda category: scores[category])",
          )

          status_path = Path("reports/current_status.json")
          status = json.loads(status_path.read_text(encoding="utf-8"))
          status["materialization_readiness_truth"]["queued_excluded"] = {
              "manual_export": 40,
              "scraper_needed": 2,
              "deferred_stub": 2,
              "semantic_duplicate": 3,
              "broken_producer": 0,
          }
          status_path.write_text(json.dumps(status, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Regenerate registry JSON
        run: python scripts/regenerate_registry_json.py

      - name: Apply pinned Ruff formatting
        run: |
          ruff format \
            moneysweep/runtime/source_registry.py \
            scripts/compare_entity_products.py \
            scripts/ingest_hud_drgr_exports.py \
            tests/test_compare_entity_products.py \
            tests/test_wave0_status_reconciliation.py
          ruff check \
            moneysweep/runtime/source_registry.py \
            scripts/compare_entity_products.py \
            scripts/ingest_hud_drgr_exports.py \
            tests/test_compare_entity_products.py \
            tests/test_wave0_status_reconciliation.py \
            tests/test_ingest_hud_drgr_exports.py \
            tests/test_source_registry_overrides.py
          git diff --check

      - name: Commit exact remediation output
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            registries/source_registry_overrides/wave0_provenance_corrections.json \
            registries/source_registry_overrides/wave0_provenance_corrections.yaml \
            reports/current_status.json \
            scripts/regenerate_registry_json.py \
            moneysweep/runtime/source_registry.py \
            scripts/compare_entity_products.py \
            scripts/ingest_hud_drgr_exports.py \
            tests/test_compare_entity_products.py \
            tests/test_wave0_status_reconciliation.py
          if ! git diff --cached --quiet; then
            git commit -m 'fix(wave0): apply CI remediation and pinned formatting'
            git push origin HEAD:agent/moneysweep-wave0-status-reconciliation-v0-3
          fi
