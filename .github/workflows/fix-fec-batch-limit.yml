name: Fix OpenFEC Schedule B Batch Limit

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/fix-fec-batch-limit.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: codex/campaign-finance-completion-v0-1
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Apply documented OpenFEC limit
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("scripts/download_fec_committees.py")
          text = path.read_text(encoding="utf-8")
          old = "COMMITTEE_BATCH_SIZE = 25"
          if old not in text:
              raise SystemExit("expected batch-size declaration not found")
          path.write_text(text.replace(old, "COMMITTEE_BATCH_SIZE = 10", 1), encoding="utf-8")
          PY
          python -m pip install 'ruff==0.15.18'
          ruff format scripts/download_fec_committees.py
          ruff check scripts/download_fec_committees.py
          python - <<'PY'
          from scripts import download_fec_committees as mod
          assert mod.COMMITTEE_BATCH_SIZE == 10
          assert list(mod._chunks(list(range(21)), mod.COMMITTEE_BATCH_SIZE)) == [
              list(range(10)),
              list(range(10, 20)),
              [20],
          ]
          PY
      - name: Publish and self-remove
        shell: bash
        run: |
          rm .github/workflows/fix-fec-batch-limit.yml
          git add scripts/download_fec_committees.py .github/workflows/fix-fec-batch-limit.yml
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "fix: honor OpenFEC ten-committee batch limit"
          git push origin HEAD:codex/campaign-finance-completion-v0-1
