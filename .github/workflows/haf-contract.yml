name: HAF Contract Gate
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  haf-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate HAF federation contract
        run: python scripts/validate_haf_contract.py
