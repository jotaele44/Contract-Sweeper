name: GUI capability parity

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:
    inputs:
      strict:
        description: Fail on all legacy GUI parity debt
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: gui-capability-parity-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Federation GUI Capability Parity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Run parity ratchet
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.strict }}
        run: >-
          python .federation/check_gui_parity_with_extensions.py
          --report artifacts/gui-parity-report.json
      - name: Run strict parity audit
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.strict }}
        run: >-
          python .federation/check_gui_parity_with_extensions.py
          --strict
          --report artifacts/gui-parity-report.json
      - name: Test the parity validator
        if: always()
        run: python -m unittest tests/test_gui_parity.py
      - name: Upload parity report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gui-parity-report
          path: artifacts/gui-parity-report.json
          if-no-files-found: warn
          retention-days: 30

  gui-reachability:
    name: GUI Reachability E2E
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: "dashboard"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.22.2"
          cache: npm
          cache-dependency-path: "dashboard/package-lock.json"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install production backend runtime
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          if [[ -f server/backend/requirements.txt ]]; then
            python -m pip install -r server/backend/requirements.txt
          else
            python -m pip install -e ".[server]"
          fi
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:gui-parity
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gui-parity-browser-evidence
          path: |
            dashboard/playwright-report/gui-parity
            dashboard/test-results
          if-no-files-found: ignore
          retention-days: 14
