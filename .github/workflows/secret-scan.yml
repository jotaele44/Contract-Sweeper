name: Secret scan

# Rendered from thehub-pr/federation-templates/baseline/secret-scan.yml.
# Edit the template there and re-render (tools/render_federation_templates.py);
# do not hand-edit this file — template-drift.yml fails the build if you do.
#
# These repos carry API-backed ingestion (HigherGov, SAM, FR24, imagery tiles),
# so a credential reaching a commit is a live risk rather than a theoretical
# one. gitleaks scans full history, which is why fetch-depth: 0 is required —
# with the default shallow clone it would only see the tip commit.
#
# Report-only to start (continue-on-error): the first run over years of history
# is the one most likely to surface false positives, and a noisy gate that
# blocks every PR on day one gets disabled rather than triaged. Triage the
# initial findings, add a .gitleaksignore for the confirmed false positives,
# then drop the continue-on-error line to make it gating.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 5 * * 1" # Mondays 05:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # full history — the point of the scan

      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
