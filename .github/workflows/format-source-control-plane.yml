name: Format source-control-plane validators

on:
  push:
    branches:
      - agent/moneysweep-certified-fail-closed-v0-4
    paths:
      - ".github/workflows/format-source-control-plane.yml"

permissions:
  contents: write

concurrency:
  group: format-source-control-plane-${{ github.ref }}
  cancel-in-progress: false

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Install repository-pinned Ruff
        run: python -m pip install ruff==0.15.18
      - name: Format only new validator and regression files
        run: |
          ruff format \
            scripts/validate_github_workflows.py \
            scripts/validate_live_fetch_dispatch.py \
            tests/test_live_fetch_dispatch.py \
            tests/test_workflow_static_validation.py
      - name: Commit formatting only if changed
        shell: bash
        run: |
          set -euo pipefail
          paths=(
            scripts/validate_github_workflows.py
            scripts/validate_live_fetch_dispatch.py
            tests/test_live_fetch_dispatch.py
            tests/test_workflow_static_validation.py
          )
          if git diff --quiet -- "${paths[@]}"; then
            echo "validator files already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "${paths[@]}"
          git commit -m "style: format source-control-plane validators"
          git push origin "HEAD:${GITHUB_REF_NAME}"
