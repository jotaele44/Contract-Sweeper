name: Centinelas intake

on:
  repository_dispatch:
    types: [centinelas-signal]

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  intake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
          cache: pip
      - name: Materialize Centinelas drop into intake
        env:
          SIGNAL: ${{ toJSON(github.event.client_payload.signal) }}
          ITEM_ID: ${{ github.event.client_payload.item_id }}
        run: |
          if [ -z "$ITEM_ID" ]; then echo "missing client_payload.item_id"; exit 1; fi
          mkdir -p intake
          printf '%s' "$SIGNAL" > "intake/${ITEM_ID}.json"
          echo "Wrote intake/${ITEM_ID}.json"
          cat "intake/${ITEM_ID}.json"
      - name: Assert isolated checkout
        run: test ! -e "$GITHUB_WORKSPACE/../thehub-pr"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          test ! -e "$GITHUB_WORKSPACE/../thehub-pr"
      - name: Ingest Centinelas signals
        run: python3 scripts/ingest_centinelas_signals.py
      - name: Regenerate federation package
        run: python3 scripts/federation_export.py --mode test
      - name: Commit refreshed federation package
        id: commit
        run: |
          git config user.name "prii-federation-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/exports/canonical_v1_federation
          if git diff --cached --quiet; then
            echo "No federation package change."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore(federation): materialize Centinelas candidate into canonical package [skip ci]"
            if git push origin "HEAD:${{ github.ref_name }}"; then
              echo "pushed=true" >> "$GITHUB_OUTPUT"
            else
              echo "push failed — package delivered as artifact instead"
              echo "pushed=false" >> "$GITHUB_OUTPUT"
            fi
          fi
      - name: Upload candidate streams and federation package
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: centinelas-intake-candidates
          path: |
            exports/centinelas_intake
            data/exports/canonical_v1_federation
          if-no-files-found: ignore
      - name: Notify Hub
        if: ${{ success() && steps.commit.outputs.pushed == 'true' }}
        env:
          FEDERATION_DISPATCH_TOKEN: ${{ secrets.FEDERATION_DISPATCH_TOKEN }}
          ITEM_ID: ${{ github.event.client_payload.item_id }}
        run: |
          if [ -z "$FEDERATION_DISPATCH_TOKEN" ]; then
            echo "No FEDERATION_DISPATCH_TOKEN — skipping Hub dispatch."
            exit 0
          fi
          curl -sSf -X POST \
            -H "Authorization: Bearer $FEDERATION_DISPATCH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/jotaele44/thehub-pr/dispatches \
            -d "{\"event_type\":\"moneysweep-export\",\"client_payload\":{\"item_id\":\"${ITEM_ID}\",\"producer\":\"moneysweep-pr\"}}"
          echo "Dispatched moneysweep-export → thehub-pr"
