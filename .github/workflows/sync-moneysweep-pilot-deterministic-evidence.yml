name: sync-moneysweep-pilot-deterministic-evidence

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/sync-moneysweep-pilot-deterministic-evidence.yml"

permissions:
  actions: read
  contents: write

jobs:
  sync-deterministic-evidence:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Download and verify deterministic evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --location \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/8695693133/zip" \
            --output /tmp/deterministic-evidence.zip
          echo "569b69011471b75b24842738ce3bf8a60ce54a4eb29a31367d4b63ca0e6f969a  /tmp/deterministic-evidence.zip" | sha256sum --check
          mkdir -p /tmp/deterministic-evidence
          unzip -q /tmp/deterministic-evidence.zip -d /tmp/deterministic-evidence
          printf '%s  %s\n' \
            88c6a9d1b9cbcca03144e8401553732d1f3eb1a8b0250b4279eb16cc556b0888 /tmp/deterministic-evidence/mobile-compact.png \
            9628a9eb32f8a653bf729b45f3b2ef31e03f5d9fdb2e18cdab4a3863d01882c2 /tmp/deterministic-evidence/mobile-wide.png \
            84b8f7578f732c9467c5e80dd2c47ec40b1f5395abf2b1de99fdcbbfe6d56b9b /tmp/deterministic-evidence/tablet.png \
            7d60239d9283c911be951c0cea809ed11e583b37d5a118534a0faca2b285ba49 /tmp/deterministic-evidence/desktop.png \
            b081fa5249b7b74d91a5f158984dbe491706a63d8378bfed2a235e6a06edf6b2 /tmp/deterministic-evidence/desktop-wide.png \
            541e67466eb87b23ee582b3344b1fd3bcc40115642df403e9c9f0be0e4eed41a /tmp/deterministic-evidence/wide.png \
            7ff5648ed7d5fd21fbd65a4cc9eee3d56d741e1249f79ff430d5ed8a98863f9a /tmp/deterministic-evidence/visual-check-report.json \
            | sha256sum --check

      - name: Synchronize deterministic atlas and ledgers
        run: |
          set -euo pipefail
          evidence=docs/evidence/moneysweep-federation-design-pilot-v0-1
          for file in mobile-compact.png mobile-wide.png tablet.png desktop.png desktop-wide.png wide.png visual-check-report.json; do
            install -m 0644 "/tmp/deterministic-evidence/${file}" "${evidence}/${file}"
          done

          cat > docs/MONEYSWEEP_FEDERATION_DESIGN_PILOT_VISUAL_STATE_ATLAS_v0_1.md <<'EOF'
          # MoneySweep Federation Design System Pilot — Visual State Atlas v0.1

          ## Deterministic reviewed runtime matrix

          Each screenshot is produced by the real MoneySweep `QueryBoundary`. The matrix exercises loading, error, empty, filtered-empty, stale-with-cached-data, and initial-offline states with shared buttons, panels, stat cards, long labels, and semantic operational badges.

          | Viewport | Size | Screenshot | SHA-256 |
          |---|---:|---|---|
          | mobile-compact | 390×844 | `mobile-compact.png` | `88c6a9d1b9cbcca03144e8401553732d1f3eb1a8b0250b4279eb16cc556b0888` |
          | mobile-wide | 430×932 | `mobile-wide.png` | `9628a9eb32f8a653bf729b45f3b2ef31e03f5d9fdb2e18cdab4a3863d01882c2` |
          | tablet | 768×1024 | `tablet.png` | `84b8f7578f732c9467c5e80dd2c47ec40b1f5395abf2b1de99fdcbbfe6d56b9b` |
          | desktop | 1280×800 | `desktop.png` | `7d60239d9283c911be951c0cea809ed11e583b37d5a118534a0faca2b285ba49` |
          | desktop-wide | 1440×900 | `desktop-wide.png` | `b081fa5249b7b74d91a5f158984dbe491706a63d8378bfed2a235e6a06edf6b2` |
          | wide | 1920×1080 | `wide.png` | `541e67466eb87b23ee582b3344b1fd3bcc40115642df403e9c9f0be0e4eed41a` |

          ## Automated checks

          - Evidence schema: **1.2.0**
          - Runtime state identities: **loading, error, empty, filtered-empty, stale, offline**
          - Initial offline precedence, cached offline data, and filtered-empty banner composition: **passed**
          - Critical/serious axe findings: **0**
          - Horizontal overflow: **0 of 12 viewport/theme runs**
          - Minimum interactive target: **44 CSS px**
          - Keyboard traversal: **passed at all six viewports**
          - Deterministic capture: reduced motion, animations disabled, caret hidden
          - Manual visual review: **passed all six screenshots**

          ## Two-run reproducibility certificate

          - Exact code head: `62758c3beb8db55bb9c7f52cb034d4952bfd59cb`
          - Workflow run: `30377448213`
          - Attempt 1 artifact: `8695575081`; ZIP SHA-256 `646891f94f495a5cc7604cdebd96dc6427341c9473397e2a493f1db8ff7aa04b`
          - Attempt 2 artifact: `8695693133`; ZIP SHA-256 `569b69011471b75b24842738ce3bf8a60ce54a4eb29a31367d4b63ca0e6f969a`
          - ZIP containers differ only in archive metadata; **all six PNGs and the JSON report are byte-identical**
          - Report SHA-256 in both attempts: `7ff5648ed7d5fd21fbd65a4cc9eee3d56d741e1249f79ff430d5ed8a98863f9a`

          Evidence directory: `docs/evidence/moneysweep-federation-design-pilot-v0-1/`.
          EOF

          cat > docs/MONEYSWEEP_FEDERATION_DESIGN_PILOT_IMPLEMENTATION_LEDGER_v0_1.md <<'EOF'
          # MoneySweep Federation Design System Pilot — Implementation Ledger v0.1

          ## Identity

          - Repository: `jotaele44/moneysweep-pr`
          - Audit baseline: `main@9cbf0bffa89424bca0f261ff45cf06df6e5c1401`
          - PR base: `main@7c8267cb9ee2af2382aec940edcc7b0becab4bd4`
          - Immutable release: `federation-design-v0.4.0-rc.1`
          - Tarball SHA-256: `4c68f03c8fc7ed0d1e62af7997e02bfca9b6c95ee1740376ebaf7a3a9752ee5b`

          ## Implemented and reviewed scope

          - Exact immutable package pin; shared async states, buttons, panels, stat cards, and semantic badges.
          - Filtered-empty delegation for contracts, entities, and relationships.
          - Reactive browser connectivity and stale-deadline updates.
          - Initial offline state precedes loading; cached status banners survive filtered-empty rendering.
          - Real-`QueryBoundary` six-viewport runtime matrix.
          - Consumer panel reset removes inherited nested chrome.
          - Deterministic screenshot capture disables animation phase and caret variance.

          ## Review findings remediated

          1. Initial `pending + paused + no data` precedence.
          2. Non-reactive connectivity and stale transitions.
          3. Direct-primitive atlas coverage gap.
          4. Nested state-panel border.
          5. Animation-phase screenshot hash drift.

          ## Verification

          - Release manifest source hashes: **11/11**; API snapshot: **35 exports, zero removals**
          - Token version: **2.0.0**; mutable references: **false**
          - Unit/runtime contracts, ESLint, production build, and offline export: **passed**
          - Axe critical/serious: **0**; horizontal overflow: **0 of 12**
          - Keyboard and 44 px target checks: **passed**
          - Two clean captures at the same code SHA: **7 of 7 internal evidence files byte-identical**
          - Deterministic run/artifacts: `30377448213`, `8695575081`, `8695693133`

          ## Preservation

          No route, backend, API, schema, data contract, source dataset, generated export, or offline-export semantic change. No other Federation consumer is bumped.
          EOF

          cat > docs/MONEYSWEEP_FEDERATION_DESIGN_PILOT_ROLLBACK_PLAN_v0_1.md <<'EOF'
          # MoneySweep Federation Design System Pilot — Rollback Plan v0.1

          ## Trigger conditions

          Roll back for route/API/data/offline-export regression; package mismatch; accessibility, keyboard, target, or overflow failure; incorrect initial-offline precedence; lost cached data/status banners; non-reactive connectivity/stale transitions; or nondeterministic evidence after animation-independent capture.

          ## Atomic rollback

          1. Revert the pilot and review-remediation commits.
          2. Restore the prior v0.3.0 package URL in both package files.
          3. Restore `QueryBoundary`, `StatsBar`, and filtered-empty rows from `main@9cbf0bffa89424bca0f261ff45cf06df6e5c1401`.
          4. Remove pilot-only harnesses, tests, styles, workflow, evidence, and ledgers.
          5. Run dependency install, lint, production build, offline export, deterministic double-run evidence, and repository-wide CI.

          No backend, API, data, schema, route, or offline-export data migration is required.
          EOF

          sed -i 's/^          //' \
            docs/MONEYSWEEP_FEDERATION_DESIGN_PILOT_VISUAL_STATE_ATLAS_v0_1.md \
            docs/MONEYSWEEP_FEDERATION_DESIGN_PILOT_IMPLEMENTATION_LEDGER_v0_1.md \
            docs/MONEYSWEEP_FEDERATION_DESIGN_PILOT_ROLLBACK_PLAN_v0_1.md

      - name: Commit exact deterministic evidence
        run: |
          set -euo pipefail
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/MONEYSWEEP_FEDERATION_DESIGN_PILOT_IMPLEMENTATION_LEDGER_v0_1.md \
            docs/MONEYSWEEP_FEDERATION_DESIGN_PILOT_VISUAL_STATE_ATLAS_v0_1.md \
            docs/MONEYSWEEP_FEDERATION_DESIGN_PILOT_ROLLBACK_PLAN_v0_1.md \
            docs/evidence/moneysweep-federation-design-pilot-v0-1
          git commit -m "docs(pilot): certify deterministic reviewed evidence"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
